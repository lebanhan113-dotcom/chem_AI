# Render Blueprint - requires a paid web plan with persistent disk.
# NEVER publish a repository containing questions_private.json as public.
services:
  - type: web
    name: eduplan-ai-714-online
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: eduplan-persistent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: EDUPLAN_DATA_DIR
        value: /data
      - key: EDUPLAN_ENV
        value: production
      - key: EDUPLAN_ADMIN_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: '1'
