services:
  - type: web
    name: chem-map-tutor-ai-3
    runtime: docker
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/runtime
    disk:
      name: chem-map-data
      mountPath: /app/runtime
      sizeGB: 1
    healthCheckPath: /api/health
