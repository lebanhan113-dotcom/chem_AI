const qbank=(G.questions||[]).filter(q=>q&&q.text&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length);const pairs=(G.pairs||[]).filter(p=>p&&p.left&&p.right),classes=(G.classifications||[]).filter(x=>x&&x.item&&x.category);

function playSound(ok=true){if(cfg.sound===false)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(ok?660:220,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(ok?880:145,audioCtx.currentTime+.13);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.19);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}

function answersHTML(q){return `<div class="question-card"><div class="eyebrow">CÂU HỎI ${st.round+1}</div><h2>${esc(q.text)}</h2></div><div class="answers" id="answer-list">${q.options.map((o,i)=>`<button class="answer" data-answer="${i}"><b>${'ABCD'[i]||i+1}.</b>${esc(o)}</button>`).join('')}</div><div id="feedback-area"></div>`}
function questionTurn(q,after,opts={}){$('#q-area').innerHTML=answersHTML(q);$('#answer-list').querySelectorAll('[data-answer]').forEach(b=>on(b,'click',()=>{if(st.paused||st.finished)return;const i=Number(b.dataset.answer),ok=i===q.correct;$('#answer-list').querySelectorAll('button').forEach(x=>{x.disabled=true;const idx=Number(x.dataset.answer);if(idx===q.correct)x.classList.add('correct');else if(idx===i)x.classList.add('wrong')});scoring(ok,opts.points||100);$('#feedback-area').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Chính xác!':'✕ Chưa đúng.'} ${esc(q.explanation||('Đáp án đúng: '+q.options[q.correct]))}</div><div class="btn-row"><button class="btn" id="next-q">${esc(opts.nextText||'Tiếp tục →')}</button></div>`;$('#next-q').onclick=()=>after(ok);if(typeof opts.done==='function')opts.done(ok)}))}
function millionaire(){const qs=shuffle(qbank).slice(0,15);let index=0,used50=false,usedSkip=false,ladder=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000],prize=0;function render(){st.round=index;$root.innerHTML=shell(`<div class="center"><h2>🏆 Bậc thang tri thức</h2><p class="muted">Vượt qua từng mốc thưởng. Cân nhắc sử dụng quyền trợ giúp.</p></div><div class="ladder">${qs.map((_,i)=>`<span class="${i===index?'on':''}">${i+1} · ${ladder[i].toLocaleString('vi')}</span>`).join('')}</div><div id="q-area"></div><div class="btn-row"><button class="btn alt small" id="fifty" ${used50?'disabled':''}>✨ 50:50</button><button class="btn alt small" id="skip" ${usedSkip?'disabled':''}>↪ Bỏ qua</button><button class="btn alt small" id="stop">⏹ Dừng nhận điểm</button></div>`, `<div class="stat"><span>MỐC THƯỞNG</span><strong>${prize.toLocaleString('vi')}</strong></div>`);bindHeader();questionTurn(qs[index],ok=>{if(!ok){const safe=index>=10?ladder[9]:index>=5?ladder[4]:0;st.score=safe;finish(false,`Bạn dừng ở mốc ${safe.toLocaleString('vi')} điểm an toàn.`);return}prize=ladder[index];st.score=prize;index++;if(index>=qs.length)finish(true,'Bạn chinh phục tất cả '+qs.length+' mốc thưởng!');else render()},{points:0});$('#fifty').onclick=()=>{used50=true;const bad=[...$('#answer-list').querySelectorAll('button')].filter(x=>Number(x.dataset.answer)!==qs[index].correct);shuffle(bad).slice(0,Math.max(0,bad.length-1)).forEach(x=>x.disabled=true);$('#fifty').disabled=true};$('#skip').onclick=()=>{usedSkip=true;index++;if(index>=qs.length)finish(true,'Hoàn thành!');else render()};$('#stop').onclick=()=>{st.score=prize;finish(true,'Bạn chủ động dừng ở mốc '+prize.toLocaleString('vi')+' điểm.')}}render()}

function loop(t){if(st.finished)return;const dt=last?Math.min(35,t-last)/16.66:1;last=t;if(!st.paused){speed=Math.min(7.5,speed+.002*dt);dist+=speed*dt;roadPhase+=speed*dt*.007;gateY+=speed*dt*.42;if(gateY>h-90&&!locked){locked=true;const ok=carLane===qs[qi].correct;scoring(ok,145);if(ok)speed=Math.min(7.5,speed+1);else{st.life--;speed=Math.max(2.5,speed-1.6);updateHud();if(st.life<=0){finish(false,'Xe đã hết năng lượng trước khi về đích.');return}}qi++;if(qi>=qs.length){finish(true,'Bạn đã về đích sau '+qs.length+' cổng kiến thức!');return}$('#race-progress').textContent=qi+'/'+qs.length;$('#race-prompt').textContent=qs[qi].text;$('#race-legend').innerHTML=qs[qi].options.map((o,i)=>`<span><b>${String.fromCharCode(65+i)}</b> ${esc(o)}</span>`).join('')}if(gateY>h+110){gateY=-110;locked=false}$('#hud-speed').textContent=Math.round(speed*23)+' km/h';draw()}if(!st.finished)raf=requestAnimationFrame(loop)}render()}
function start(){reset();if(kind==='millionaire')millionaire();else if(kind==='bell')bell();else if(kind==='wheel')wheel();else if(kind==='memory')memory();else if(kind==='bubbles')bubbles();else if(kind==='racing')racing();else if(kind==='matching')matching();else if(kind==='sorting')sorting();else intro();if(cfg.timeLimit>0)tick(cfg.timeLimit,()=>finish(false,'Đã hết thời gian chơi.'))}
intro();window.addEventListener('message',e=>{if(e.data?.type==='EDUGAME_PAUSE'&&st.playing&&!st.paused)pause()});
})();
</script>
<script>(()=>{'use strict';

let state={lessons:[],instances:[],activeLessonId:null},page='dashboard',bankTab='questions',gameFilter='all',saveTimer=null,loading=false,db=null,backendReady=false;
const SAMPLE_Q=[['Nguyên tử có số hiệu nguyên tử Z = 17 là nguyên tố nào?',['Na','Cl','Ar','S'],1,'Z = 17 tương ứng với chlorine (Cl).'],['Nguyên tố nào thuộc nhóm kim loại kiềm?',['Na','Mg','Cl','Ne'],0,'Na thuộc nhóm IA (nhóm 1).'],['Một nguyên tử trung hòa có 12 proton. Số electron bằng bao nhiêu?',['10','11','12','14'],2,'Trong nguyên tử trung hòa, số proton bằng số electron.'],['Nguyên tố có cấu hình electron 1s²2s²2p⁶3s¹ là?',['Mg','Al','Na','Si'],2,'Tổng 11 electron, nguyên tố sodium (Na).'],['Trong một chu kì, điện tích hạt nhân tăng theo chiều nào?',['Phải sang trái','Trái sang phải','Từ dưới lên','Không đổi'],1,'Các nguyên tố được xếp theo chiều tăng điện tích hạt nhân.'],['Nguyên tố nào là khí hiếm?',['F','Cl','Ne','Na'],2,'Ne thuộc nhóm 18, nhóm khí hiếm.'],['Nguyên tử có ba lớp electron thuộc chu kì mấy?',['1','2','3','4'],2,'Số lớp electron đã chiếm bằng số thứ tự chu kì.'],['Cl thuộc nhóm nguyên tố nào?',['Kim loại kiềm','Halogen','Khí hiếm','Kim loại kiềm thổ'],1,'Cl thuộc nhóm VIIA (nhóm 17), halogen.'],['Nguyên tố Mg có số hiệu nguyên tử là?',['11','12','13','14'],1,'Mg có 12 proton.'],['Nguyên tố nào có tính kim loại rõ hơn trong cặp sau?',['Na','Cl','Ne','Ar'],0,'Na là kim loại kiềm; các lựa chọn còn lại là phi kim/khí hiếm.'],['Kí hiệu hóa học của oxygen là?',['Ox','O','Og','Os'],1,'O là kí hiệu hóa học của oxygen.'],['Nguyên tố nào ở chu kì 2?',['Na','Mg','O','K'],2,'O nằm ở chu kì 2.'],['Số electron lớp ngoài cùng của Na ở trạng thái cơ bản là?',['1','2','3','7'],0,'Na có cấu hình 1s²2s²2p⁶3s¹.'],['Trong bảng tuần hoàn hiện đại có bao nhiêu chu kì?',['5','6','7','8'],2,'Bảng tuần hoàn hiện đại có 7 chu kì.'],['Số thứ tự ô nguyên tố bằng đại lượng nào?',['Số neutron','Số hiệu nguyên tử','Số khối','Số lớp electron'],1,'Số thứ tự ô nguyên tố bằng số hiệu nguyên tử Z.'],['Nguyên tử calcium (Z=20) thuộc chu kì nào?',['2','3','4','5'],2,'Cấu hình lớp ngoài 4s², thuộc chu kì 4.']];
function refreshActivities(l){l.activities=[...(l.questions||[]).map(x=>({id:'act-'+x.id,type:'Chọn đáp án',sourceId:x.id,instruction:x.text,expected:x.options?.[x.correct]||''})),...(l.pairs||[]).map(x=>({id:'act-'+x.id,type:'Ghép đôi',sourceId:x.id,instruction:'Ghép '+x.left+' với giá trị tương ứng',expected:x.right})),...(l.classifications||[]).map(x=>({id:'act-'+x.id,type:'Phân loại',sourceId:x.id,instruction:'Xác định nhóm của '+x.item,expected:x.category}))]}
function sample(){const id=uid('lesson');const out={id,title:'Bảng tuần hoàn các nguyên tố hóa học',subject:'Hóa học',grade:'10',topic:'Bảng tuần hoàn',objectives:'Nhận biết ô nguyên tố, nhóm, chu kì; vận dụng cấu hình electron để xác định vị trí nguyên tố.',content:'Số hiệu nguyên tử Z bằng số proton. Trong nguyên tử trung hòa, số electron bằng Z. Số lớp electron đã chiếm bằng số thứ tự chu kì. Na thuộc nhóm kim loại kiềm. Mg thuộc nhóm kim loại kiềm thổ. Cl và F thuộc nhóm halogen. Ne và Ar là khí hiếm.\n'+SAMPLE_Q.map((q,i)=>`Câu ${i+1}. ${q[0]}\n${q[1].map((v,j)=>String.fromCharCode(65+j)+'. '+v).join('\n')}\nĐáp án: ${String.fromCharCode(65+q[2])}\nGiải thích: ${q[3]}`).join('\n\n'),knowledge:[{id:uid('k'),content:'Số hiệu nguyên tử Z bằng số proton trong hạt nhân.',type:'Quy tắc'},{id:uid('k'),content:'Trong nguyên tử trung hòa, số electron bằng Z.',type:'Quy tắc'},{id:uid('k'),content:'Số lớp electron đã chiếm bằng số thứ tự chu kì.',type:'Quy tắc'}],questions:SAMPLE_Q.map(q=>({id:uid('q'),text:q[0],options:q[1],correct:q[2],explanation:q[3]})),pairs:[['Na','Sodium'],['Cl','Chlorine'],['Mg','Magnesium'],['O','Oxygen'],['Ne','Neon'],['F','Fluorine'],['Ca','Calcium'],['K','Potassium'],['Fe','Iron'],['S','Sulfur']].map(x=>({id:uid('p'),left:x[0],right:x[1]})),classifications:[['Na','Kim loại'],['Mg','Kim loại'],['Ca','Kim loại'],['K','Kim loại'],['Cl','Phi kim'],['F','Phi kim'],['O','Phi kim'],['S','Phi kim'],['Ne','Khí hiếm'],['Ar','Khí hiếm']].map(x=>({id:uid('c'),item:x[0],category:x[1]})),analyzed:'MẪU',approved:true,revision:1,updated:Date.now(),created:Date.now()};refreshActivities(out);return out}
async function database(){return new Promise((resolve,reject)=>{if(!indexedDB)return reject(new Error('IndexedDB không khả dụng'));let r=indexedDB.open('edu-game-studio-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('workspace');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){try{db=await database();let result=await new Promise((resolve,reject)=>{const tx=db.transaction('workspace','readonly'),req=tx.objectStore('workspace').get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(result&&Array.isArray(result.lessons)&&Array.isArray(result.instances))state=result;state.lessons.forEach(l=>{if(!Array.isArray(l.activities))refreshActivities(l)});document.getElementById('save-status').innerHTML='<span class="dot"></span> Đã kết nối lưu trữ cục bộ'}catch(e){try{const s=localStorage.getItem('edu-game-studio-fallback');if(s)state=JSON.parse(s);toast('Đang sử dụng localStorage dự phòng; hãy sao lưu dự án.')}catch(_){}document.getElementById('save-status').textContent='⚠ Lưu trữ dự phòng'}render();checkBackend()}
function save(){document.getElementById('save-status').textContent='◌ Đang lưu...';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{if(db){await new Promise((resolve,reject)=>{const tx=db.transaction('workspace','readwrite');tx.objectStore('workspace').put(state,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}else localStorage.setItem('edu-game-studio-fallback',JSON.stringify(state));document.getElementById('save-status').innerHTML='<span class="dot"></span> Đã lưu '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('save-status').textContent='⚠ Lưu thất bại';toast('Không thể lưu dữ liệu: '+e.message)}},250)}

function dashboard(){const l=current();return header('Xin chào, thầy cô 👋','Biến kiến thức thành trò chơi tương tác – không cần lập trình.')+`<div class="banner"><div><div class="eyebrow" style="color:#d0dbff">XƯỞNG SÁNG TẠO TRÒ CHƠI GIÁO DỤC</div><h2>Khơi nguồn hứng thú trong mỗi tiết học</h2><p>Nhập bài học một lần. Tạo tám kiểu gameplay, chơi thử, chỉnh sửa và tải từng trò chơi HTML độc lập.</p>${button('✦ Tạo bài học mới','new-lesson','ghost')}</div></div><div class="grid four" style="margin-top:19px"><div class="card kpi"><div class="k-icon">📚</div><strong>${state.lessons.length}</strong><span>Bài học đã lưu</span></div><div class="card kpi"><div class="k-icon">🎮</div><strong>${state.instances.length}</strong><span>Trò chơi đã tạo</span></div><div class="card kpi"><div class="k-icon">🧠</div><strong>${state.lessons.reduce((n,l)=>n+(l.knowledge?.length||0),0)}</strong><span>Đơn vị kiến thức</span></div><div class="card kpi"><div class="k-icon">📥</div><strong>${state.instances.filter(x=>x.lastExport).length}</strong><span>Trò chơi từng xuất</span></div></div><div class="grid two" style="margin-top:19px"><div class="card"><div class="section-head"><div class="small-head">Bài học gần đây</div>${button('Xem tất cả →','lessons','ghost sm')}</div>${state.lessons.length?state.lessons.slice(-4).reverse().map(l=>`<div class="data-row row space"><div><strong>${esc(l.title)}</strong><p>${esc(l.subject)} · Lớp ${esc(l.grade)} · ${date(l.updated)}</p></div><button class="btn sm" data-action="open-lesson" data-id="${l.id}">Mở</button></div>`).join(''):`<div class="empty"><p>Chưa có bài học. Có thể bắt đầu với mẫu Hóa học 10.</p>${button('📗 Nạp bài học mẫu','sample','primary')}</div>`}</div><div class="card"><div class="section-head"><div class="small-head">Quy trình tạo game</div></div>${[['01','Nhập và lưu nội dung bài học'],['02','Tạo và duyệt Knowledge / Activity Bank'],['03','Chọn 1 trong 8 gameplay'],['04','Tạo Game Instance độc lập'],['05','Chơi thử, chỉnh sửa, xuất HTML']].map(x=>`<div class="row" style="padding:11px 0;border-bottom:1px solid #f0f2f8"><span class="pill">${x[0]}</span><div style="font-size:13px;color:#4a5b79">${x[1]}</div></div>`).join('')}<div class="note" style="margin-top:15px">${backendReady?'🟢 Gemini backend đã kết nối.':'🟡 Đang ở chế độ phân tích cục bộ. Có thể kết nối Gemini qua server tùy chọn.'}</div></div></div>`}

function editor(){let l=current();if(!l)return noLesson();return header('Biên soạn bài học','Nhập nội dung một lần, phân tích thành dữ liệu tái sử dụng.',button('← Danh sách','lessons','ghost')+button('💾 Lưu bài học','save-lesson','primary'))+`<div class="card">${stamp()}<div class="line"></div><div class="grid two"><div class="field"><label>Tên bài học *</label><input data-lesson-field="title" value="${esc(l.title)}" placeholder="VD: Bảng tuần hoàn các nguyên tố"></div><div class="field"><label>Môn học</label><select data-lesson-field="subject">${['Hóa học','Vật lí','Sinh học','Toán','Ngữ văn','Tiếng Anh','Lịch sử','Địa lí','Tin học','Công nghệ','Khoa học tự nhiên','Khác'].map(x=>`<option ${x===l.subject?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Lớp học</label><select data-lesson-field="grade">${Array.from({length:12},(_,i)=>String(i+1)).map(x=>`<option ${x===l.grade?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Chủ đề</label><input data-lesson-field="topic" value="${esc(l.topic||'')}" placeholder="Chủ đề chương trình"></div></div><div class="field" style="margin-top:15px"><label>Mục tiêu học tập</label><textarea data-lesson-field="objectives" rows="3" style="min-height:85px" placeholder="Mục tiêu, yêu cầu cần đạt">${esc(l.objectives||'')}</textarea></div><div class="field" style="margin-top:15px"><label>Nội dung bài học *</label><textarea id="lesson-content" data-lesson-field="content" rows="14" style="min-height:330px" placeholder="Dán kiến thức và câu hỏi tại đây...">${esc(l.content||'')}</textarea></div><div class="grid two" style="margin-top:14px"><label class="dropzone">📎 Tải lên TXT / MD / DOCX / PDF<input id="import-lesson-file" type="file" accept=".txt,.md,.csv,.docx,.pdf" hidden></label><div class="note">Cú pháp cục bộ: <b>Câu 1.</b> nội dung; các dòng <b>A.</b> đến <b>D.</b>; <b>Đáp án: B</b>. Ghép đôi: <b>Na = Sodium</b>. Phân loại: <b>Na | Kim loại</b>.</div></div><div class="lin async function analyze(ai=false){const l=current();if(!l)return;if(!l.content?.trim()){toast('Hãy nhập nội dung bài học trước.');return}if(ai&&!backendReady){toast('Chưa có kết nối Gemini backend. Chạy server Node kèm API key.');return}const prog=$('#analysis-progress');if(prog)prog.innerHTML='<span class="loader"></span> Đang phân tích nội dung...';try{let result;if(ai){let res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:l.title,grade:l.grade,subject:l.subject,objectives:l.objectives,content:l.content})});let j=await res.json();if(!res.ok)throw Error(j.error||'Gemini không trả kết quả');result=j.data}else result=parseLocal(l.content);function valid(type,arr){if(!Array.isArray(arr))return[];return arr.map(x=>({...x,id:x.id||uid(type)})).filter(x=>type==='k'?!!x.content:type==='q'?!!x.text&&Array.isArray(x.options)&&x.options.length>=2&&Number.isInteger(x.correct)&&x.correct>=0&&x.correct<x.options.length:type==='p'?!!x.left&&!!x.right:!!x.item&&!!x.category)}const k=valid('k',result.knowledge),q=valid('q',result.questions),p=valid('p',result.pairs),c=valid('c',result.classifications);if(!(k.length+q.length+p.length+c.length))throw Error('Không tìm thấy dữ liệu có thể sử dụng. Hãy nhập câu hỏi theo định dạng ở phần hướng dẫn hoặc dùng Gemini.');const hasOld=(l.knowledge?.length||0)+(l.questions?.length||0)+(l.pairs?.length||0)+(l.classifications?.length||0)>0;if(hasOld&&!confirm('Phân tích lại sẽ thay thế ngân hàng hiện tại của bài học (không thay các game đã tạo). Tiếp tục?'))return;l.knowledge=k;l.questions=q;l.pairs=p;l.classifications=c;refreshActivities(l);l.analyzed=ai?'GEMINI':'CỤC BỘ';l.approved=false;l.revision=(l.revision||0)+1;l.updated=Date.now();save();render();toast((ai?'Gemini':'Bộ phân tích cục bộ')+' tạo '+q.length+' câu hỏi, '+p.length+' cặp, '+c.length+' thẻ phân loại. Hãy kiểm tra, phê duyệt.') ;modal(`<h2>🧠 Kết quả phân tích</h2><p class="lead">${ai?'Gemini AI':'Phân tích cục bộ function getGame(id){return state.instances.find(x=>x.id===id)}
function payload(g){return {id:g.id,name:g.name,kind:g.kind,lessonTitle:g.lessonTitle,subject:g.subject,grade:g.grade,questions:g.questions||[],pairs:g.pairs||[],classifications:g.classifications||[],config:g.config||{}}}
function standaloneHTML(g){const css=$('#game-style-source').textContent,js=$('#game-runtime-source').textContent;const json=JSON.stringify(payload(g)).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');return '<!DOCTYPE html>\n<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>'+esc(g.name)+'</title><meta name="author" content="Giáo viên: Lê Bá Nhẫn – Trường THPT Hòn Đất (An Giang)"><style>'+css+'</style></head><body><div id="game-root"></div><script id="game-payload" type="application/json">'+json+'<'+'/script><script>'+js+'<'+'/script></body></html>'}
function previewGame(g){const html=standaloneHTML(g);modal(`<h2>▶ ${esc(g.name)}</h2><p class="lead">Đang chạy bằng chính HTML offline sẽ được xuất. Dữ liệu của Instance ${esc(g.id.slice(-8))}.</p><iframe title="Chơi thử ${esc(g.name)}" class="preview-frame" id="game-preview" sandbox="allow-scripts allow-modals" allow="autoplay"></iframe><div class="form-actions">${button('Đóng','close-modal','ghost')}<button class="btn primary" data-action="export-game" data-id="${g.id}">↓ Tải HTML riêng</button></div>`,true);$('#game-preview').srcdoc=html}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)}
function download(data,name,type='text/html;charset=utf-8'){const blob=new Blob([data],{type});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function exportGame(g){if(!g)return;const v=validateGame(g);if(v){toast('Không thể xuất: '+v);return}try{const html=standaloneHTML(g);if(!html.includes('id="game-payload"')||!html.includes('id="game-root"'))throw Error('Thiếu Runtime hoặc dữ liệu.');const name='game-'+slug(names[g.kind])+'-'+g.id.slice(-5)+'.html';download(html,name);g.lastExport={revision:g.revision,at:Date.now(),name,bytes:new Blob([html]).size};save();render();toast('Đã gửi trình duyệt tải '+name+'. Mở tệp để kiểm thử ngoại tuyến.')}catch(e){toast('Xuất HTML thất bại: '+e.message)}}
function validateGame(g){if(!names[g.kind])return'Không nhận diện Game Type';if(['millionaire','bell','wheel','bubbles','racing'].includes(g.kind)&&!g.questions?.some(q=>Array.isArray(q.options)&&Number.isInteger(q.correct)&&q.correct<q.options.length))return'Thiếu câu hỏi hợp lệ';if(['memory','matching'].includes(g.kind)&&(!g.pairs||g.pairs.length<2))return'Cần ít nhất hai cặp';if(g.kind==='sorting'&&(!g.classifications||g.classifications.length<3))return'Cần ít nhất ba thẻ phân loại';return null}
function gameEdit(g){let rows='',dataType=['millionaire','bell','wheel','bubbles','racing'].includes(g.kind)?'questions':['memory','matching'].includes(g.kind)?'pairs':'classifications';const a=g[dataType]||[];rows=a.map((x,i)=>{let t=dataType==='questions'?x.text:dataType==='pairs'?x.left+' ↔ '+x.right:x.item+' → '+x.category;return `<div class="data-row row space"><div style="min-width:0"><strong>${i+1}. ${esc(t)}</strong></div><button class="btn xs ghost" data-action="edit-game-item" data-id="${g.id}" data-idx="${i}" data-type="${dataType}">Sửa</button></div>`}).join('');modal(`<h2>✏ Chỉnh sửa Game Instance</h2><p class="lead">${names[g.kind]} · ID ${esc(g.id.slice(-8))} · Chỉnh riêng, không ảnh hưởng ngân hàng gốc.</p><div class="grid two"><div class="field"><label>Tên game</label><input id="eg-name" value="${esc(g.name)}"></div><div class="field"><label>Số mạng</label><input id="eg-lives" type="number" min="1" max="20" value="${g.config.lives||3}"></div><div class="field"><label>Thời gian giới hạn (giây)</label><input id="eg-time" type="number" min="0" max="3600" value="${g.config.timeLimit||0}"></div><div class="field"><label>Âm thanh</label><select id="eg-sound"><option value="true" ${g.config.sound!==false?'selected':''}>Bật</option><option value="false" ${g.config.sound===false?'selected':''}>Tắt</option></select></div></div><div class="line"></div><div class="row space"><strong>🎓 Dữ liệu game (${a.length})</strong><span class="pill">${dataType==='questions'?'Câu hỏi':dataType==='pairs'?'Cặp ghép':'Phân loại'}</span></div><div style="max-height:240px;overflow:auto;margin:12px 0;border:1px solid #e8edf4;border-radius:10px">${rows}</div><div class="form-actions">${button('Đóng','close-modal','ghost')}<button class="btn primary" id="save-game-edits">💾 Lưu thay đổi</button></div>`);$('#save-game-edits').onclick=()=>{if(!$('#eg-name').value.trim()){toast('Tên game không được để trống');return}g.name=$('#eg-name').value.trim();g.config.lives=Math.max(1,Number($('#eg-lives').value)||3);g.config.timeLimit=Math.max(0,Number($('#eg-time').value)||0);g.config.sound=$('#eg-sound').value==='true';g.revision++;g.updated=Date.now();save();closeModal();render();toast('Đã lưu cấu hình game.')}}
function editGameItem(g,index,type){const x=g[type][index];const label=type==='questions'?'Câu hỏi':type==='pairs'?'Ghép đôi':'Phân loại';let html=`<h2>Sửa ${label} trong game</h2><p class="lead">Thay đổi chỉ ảnh hưởng Instance hiện tại.</p>`;if(type==='questions'){html+=`<div class="field"><label>Nội dung</label><textarea id="eq-text" style="min-height:92px">${esc(x.text)}</textarea></div><div class="grid two">${x.options.map((v,i)=>`<div class="field"><label>Lựa chọn ${'ABCD'[i]||i+1}</label><input id="eq-opt-${i}" value="${esc(v)}"></div>`).join('')}</div><div class="field"><label>Đáp án đúng</label><select id="eq-correct">${x.options.map((_,i)=>`<option value="${i}" ${x.correct===i?'selected':''}>${'ABCD'[i]||i+1}</option>`).join('')}</select></div><div class="field"><label>Giải thích</label><textarea id="eq-explain" style="min-height:85px">${esc(x.explanation||'')}</textarea></div>`}else if(type==='pairs')html+=`<div class="grid two"><div class="field"><label>Vế trái</label><input id="eq-left" value="${esc(x.left)}"></div><div class="field"><label>Vế phải</label><input id="eq-right" value="${esc(x.right)}"></div></div>`;else html+=`<div class="grid two"><div class="field"><label>Đối tượng</label><input id="eq-item" value="${esc(x.item)}"></div><div class="field"><label>Nhóm</label><input id="eq-category" value="${esc(x.category)}"></div></div>`;html+=`<div class="form-actions">${button('Quay lại','back-to-game-editor','ghost',`data-id="${g.id}"`)}<button class="btn primary" id="save-eq">💾 Lưu dữ liệu</button></div>`;modal(html);$('#save-eq').onclick=()=>{if(type==='questions'){x.text=$('#eq-text').value.trim();x.options=x.options.map((_,i)=>$('#eq-opt-'+i).value.trim());x.correct=Number($('#eq-correct').value);x.explanation=$('#eq-explain').value.trim();if(!x.text||x.options.some(v=>!v)){toast('Câu hỏi và phương án không được trống');return}}else if(type==='pairs'){x.left=$('#eq-left').value.trim();x.right=$('#eq-right').value.trim();if(!x.left||!x.right)return toast('Cần điền cả hai vế')}else{x.item=$('#eq-item').value.trim();x.category=$('#eq-category').value.trim();if(!x.item||!x.category)return toast('Cần điền đủ đối tượng và nhóm')}g.revision++;g.updated=Date.now();save();gameEdit(g);toast('Đã cập nhật dữ liệu của Game Instance.')}}
async function checkBackend(){if(!location.protocol.startsWith('http')){backendReady=false;return}try{let r=await fetch('/api/health',{signal:AbortSignal.timeout(3000)}),v=await r.json();backendReady=!!v.gemini;render()}catch(e){backendReady=false}}
function handleAction(target){const a=target.dataset.action,id=target.dataset.id,kind=target.dataset.kind;const l=current();switch(a){case'dashboard':case'lessons':case'editor':case'bank':case'library':case'instances':case'settings':navigate(a);break;case'new-lesson':{let o={id:uid('lesson'),title:'Bài học mới',subject:'Hóa học',grade:'10',topic:'',objectives:'',content:'',knowledge:[],questions:[],pairs:[],classifications:[],activities:[],revision:1,approved:false,created:Date.now(),updated:Date.now()};state.lessons.push(o);setCurrent(o.id);save();navigate('editor');break}case'sample':{let s=sample();state.lessons.push(s);setCurrent(s.id);save();navigate('editor');toast('Đã tạo bài học mẫu Hóa 10 với dữ liệu thực tế để thử game.');break}case'open-lesson':setCurrent(id);navigate('editor');break;case'delete-lesson':{let ob=state.lessons.find(x=>x.id===id);if(!ob||!confirm('Xóa bài học '+ob.title+' và các Game Instance liên quan?'))return;state.lessons=state.lessons.filter(x=>x.id!==id);state.instances=state.instances.filter(x=>x.lessonId!==id);if(state.activeLessonId===id)state.activeLessonId=state.lessons[0]?.id||null;save();render();break}case'save-lesson':save();toast('Đã yêu cầu lưu bài học.');break;case'analyze-local':analyze(false);break;case'analyze-ai':analyze(true);break;case'approve-lesson':if(l){l.approved=true;save();closeModal();navigate('bank');toast('Đã phê duyệt dữ liệu bài học.')}break;case'bank-tab':bankTab=target.dataset.key;render();break;case'add-bank':if(bankTab!=='activities')editBank();break;case'edit-bank':if(bankTab!=='activities')editBank(id);break;case'delete-bank':if(bankTab==='activities')break;if(l&&confirm('Xóa dữ liệu này khỏi ngân hàng nguồn?')){l[bankTab]=l[bankTab].filter(x=>x.id!==id);refreshActivities(l);l.approved=false;save();render()}break;case'filter':gameFilter=target.dataset.key;render();break;case'create-game':createGame(kind);break;case'play-game':{let g=getGame(id);if(g)previewGame(g);break}case'edit-game':{let g=getGame(id);if(g)gameEdit(g);break}case'edit-game-item':{let g=getGame(id);if(g)editGameItem(g,Number(target.dataset.idx),target.dataset.type);break}case'back-to-game-editor':{let g=getGame(id);if(g)gameEdit(g);break}case'clone-game':{let g=getGame(id);if(!g)return;let o=copy(g);o.id=uid('game');o.name=g.name+' (bản sao)';o.revision=1;o.created=o.updated=Date.now();delete o.lastExport;state.instances.push(o);save();render();toast('Đã nhân bản thành một Game Instance độc lập.');break}case'delete-game':{let g=getGame(id);if(g&&confirm('Xóa trò chơi '+g.name+'? Ngân hàng bài học sẽ không bị xóa.')){state.instances=state.instances.filter(x=>x.id!==id);save();render();toast('Đã xóa Game Instance.')}break}case'export-game':{let g=getGame(id);if(g){closeModal();exportGame(g)}break}case'close-modal':closeModal();break;case'backup':download(JSON.stringify(state,null,2),'edugame-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Đã tạo bản sao JSON.');break;case'check-ai':checkBackend().then(()=>toast(backendReady?'Đã kết nối Gemini backend.':'Chưa có Gemini backend khả dụng.'));break;default:break}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;handleAction(b)});$$('.nav-btn').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#mobile-menu').onclick=()=>$('#sidebar').classList.toggle('open');load();
})();
</script></body></html>
