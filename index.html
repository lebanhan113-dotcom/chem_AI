function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;'}[x]||'&#39;'))}

function uid(){return globalThis.crypto?.randomUUID?.()||('u'+Date.now()+'_'+Math.random().toString(36).slice(2))}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function sample(a,n){return shuffle(a).slice(0,n)}
function num(x){return Math.max(0,parseInt(x,10)||0)}

function download(name,content,type='text/plain;charset=utf-8'){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

function curriculumPage(){return `${header('CHƯƠNG TRÌNH','Danh mục Hóa học KNTT lớp '+STATE.grade,'Hiển thị tên từng chương, từng bài, bao gồm các bài ôn tập theo thứ tự trong sách giáo khoa.')}<div class="row" style="margin-bottom:12px"><span class="tag">${gCh().length} chương</span><span class="tag">${gCh().reduce((s,c)=>s+c[1].length,0)} bài (kể cả ôn tập)</span><input id="lessonSearch" placeholder="Tìm tên bài hoặc chương..." oninput="filterLessons()" style="max-width:400px"></div><div id="chapterBox">${gCh().map(([name,ls],ci)=>`<details class="chapter" open data-search="${esc((name+' '+ls.join(' ')).toLowerCase())}"><summary>Chương ${ci+1}. ${esc(name)} <span class="muted small">• ${ls.length} bài</span></summary><div class="lessons">${ls.map((l,i)=>`<div class="lesson"><span><b>Bài ${1+gCh().slice(0,ci).reduce((s,x)=>s+x[1].length,0)+i}.</b> ${esc(l)}</span>${btn('Dùng bài này',`useLesson(${ci},${i})`,'secondary sm')}</div>`).join('')}</div></details>`).join('')}</div>${guide('curriculum')}`}
function filterLessons(){const s=input('lessonSearch').toLowerCase().trim();document.querySelectorAll('#chapterBox .chapter').forEach(x=>{x.hidden=!x.dataset.search.includes(s);if(s&& !x.hidden)x.open=true})}
function useLesson(ci,i){STATE.chapter=ci;STATE.lesson=gCh()[ci][1][i];toast('Đã chọn Bài: '+STATE.lesson);go('exams')}
function chaptersSelect(id='chap',fn='onChapterChanged',val=STATE.chapter){return `<select id="${id}" onchange="${fn}()">${chaptersOptions()}</select>`}
function onChapterChanged(){STATE.chapter=num(input('builderChapter'));STATE.lesson='';const e=$id('builderLesson');if(e)e.innerHTML=lessonOptions(STATE.grade,STATE.chapter,false)}
function bankFiltered(){let s=(input('searchBank')||STATE.filter||'').toLowerCase();let cat=input('bankChapter');let type=input('bankType');let status=input('bankStatus');return DATA.questions.filter(q=>q.grade===STATE.grade&&(cat==='all'||cat===undefined||Number(cat)===q.chapter)&&(!type||type==='all'||q.type===type)&&(!status||status==='all'||(status==='approved'?q.approved:!q.approved))&&(!s||[q.text,q.lesson,q.source,...(q.options||[])].join(' ').toLowerCase().includes(s)))}
function bankPage(){const list=DATA.questions.filter(q=>q.grade===STATE.grade);return `${header('CHEM-ERROR / EXAMTRACE','Ngân hàng câu hỏi Hóa '+STATE.grade,'Phân loại nhận biết – thông hiểu – vận dụng tính toán – vận dụng cao. Câu AI chờ giáo viên duyệt.')}<div class="row" style="margin:12px 0">${btn('＋ Thêm câu hỏi',"questionEditor()",'mint')}${btn('Nhập dữ liệu JSON',"$id('bankImport').click()")}${btn('Xuất ngân hàng JSON',"exportBank()") }<input type="file" id="bankImport" accept=".json" onchange="importBank(event)" class="hide"><span class="tag approved">${list.filter(x=>x.approved).length} đã duyệt</span><span class="tag pending">${list.filter(x=>!x.approved).length} chờ duyệt</span></div><div class="card"><div class="formgrid"><div class="field wide"><label>Tìm nội dung câu hỏi</label><input id="searchBank" placeholder="Từ khóa, bài, phản ứng..." value="${esc(STATE.filter)}" oninput="STATE.filter=this.value;refreshBankList()"></div><div class="field"><label>Chương</label><select id="bankChapter" onchange="refreshBankList()"><option value="all">Tất cả chương</option>${chaptersOptions()}</select></div><div class="field"><label>Loại câu</label><select id="bankType" onchange="refreshBankList()"><option value="all">Tất cả loại</option>${QTYPE.map(t=>`<option value="${t}">${QTNAME[t]}</option>`).join('')}</select></div><div class="field"><label>Trạng thái</label><select id="bankStatus" onchange="refreshBankList()"><option value="all">Tất cả</option><option value="approved">Đã duyệt</option><option value="pending">Chờ duyệt</option></select></div></div><div id="bankList"></div></div>${guide('bank')}`}
function refreshBankList(){const box=$id('bankList');if(!box)return;const arr=bankFiltered();box.innerHTML=`<p class="muted small">Hiển thị ${arr.length} câu hỏi${arr.length>150?' (150 câu đầu)':''}</p>${arr.slice(0,150).map((q,i)=>`<div class="list-item"><div class="row between"><div class="pillrow"><span class="tag">${QTNAME[q.type]||q.type}</span>${lev(q)}${qualityLabel(q)}</div><span class="muted mini">Chương ${q.chapter+1}</span></div><b class="small">${i+1}. ${esc(q.text)}</b><p class="muted small" style="margin:4px 0">${esc(q.lesson)} • Nguồn: ${esc(q.source||'Giáo viên biên soạn')}</p><div class="row">${btn('Xem / sửa',`questionEditor('${esc(q.id)}')`,'secondary sm')}${!q.approved?btn('Duyệt',`approveQ('${esc(q.id)}')`,'mint sm'):''}${btn('Xóa',`deleteQ('${esc(q.id)}')`,'red sm')}</div></div>`).join('')||'<div class="notice warn">Không tìm thấy câu phù hợp. Hãy thêm câu hoặc gọi AI để đề xuất câu mới.</div>'}`}
function approveQ(id){const q=DATA.questions.find(q=>q.id===id);if(!q)return;if(!confirm('Bạn đã kiểm tra tính chính xác, đáp án và nguồn của câu hỏi này?'))return;q.approved=true;save();refreshBankList();toast('Đã phê duyệt câu hỏi')}
function deleteQ(id){if(!isTeacher()){toast('Chức năng dành cho giáo viên');return}if(!confirm('Xóa câu hỏi?'))return;DATA.questions=DATA.questions.filter(q=>q.id!==id);save();refreshBankList()}
function dialog(content){let d=$id('editorOverlay');if(d)d.remove();d=document.createElement('div');d.id='editorOverlay';d.className='modalback';d.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="row between"><h2 style="margin:0;font-size:20px">Biên soạn học liệu</h2><button class="btn red sm" onclick="closeDialog()">✕ Đóng</button></div><hr>${content}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeDialog()});document.body.append(d)}
function closeDialog(){$id('editorOverlay')?.remove()}
function questionEditor(id=''){if(!isTeacher()){toast('Chỉ giáo viên được biên soạn');return}let q=DATA.questions.find(x=>x.id===id)||{grade:STATE.grade,chapter:STATE.chapter,lesson:gCh()[STATE.chapter]?.[1]?.[0]||'',type:'mcq',level:'NB',text:'',options:['','','',''],answer:0,explain:'',source:'Giáo viên tự biên soạn',approved:false};const val=q.type==='mcq'?Number(q.answer)+1:q.type==='tf'?(q.answer||[]).map(x=>x?'Đ':'S').join(','):String(q.answer||'');dialog(`<div class="formgrid"><div class="field"><label>Chương</label><select id="edC" onchange="document.getElementById('edL').innerHTML=lessonOptions(${STATE.grade},Number(this.value),false)">${chaptersOptions()}</select></div><div class="field"><label>Bài</label><select id="edL">${lessonOptions(STATE.grade,q.chapter)}</select></div><div class="field"><label>Loại câu</label><select id="edT" onchange="editorTypeChanged()">${QTYPE.map(t=>`<option value="${t}">${QTNAME[t]}</option>`).join('')}</select></div><div class="field"><label>Mức độ</label><select id="edV">${Object.keys(LEVELS).map(t=>`<option value="${t}">${LEVELS[t]}</option>`).join('')}</select></div><div class="field full"><label>Nội dung câu hỏi</label><textarea rows="3" id="edText">${esc(q.text)}</textarea></div><div class="field full"><label>Phương án: mỗi dòng một phương án (MCQ 4 dòng; Đúng/Sai 4 mệnh đề)</label><textarea id="edOp" rows="5">${esc((q.options||[]).join('\n'))}</textarea></div><div class="field wide"><label>Đáp án (MCQ: 1/2/3/4; Đ/S: Đ,S,Đ,S; ngắn: giá trị; tự luận: lời giải mẫu)</label><textarea id="edAns">${esc(val)}</textarea></div><div class="field wide"><label>Nguồn tham khảo</label><textarea id="edSrc">${esc(q.source||'')}</textarea></div><div class="field full"><label>Lời giải / giải thích</label><textarea id="edExp">${esc(q.explain||'')}</textarea></div></div><div class="row" style="margin-top:14px"><label class="small"><input type="checkbox" id="edApprove" style="width:auto" ${q.approved?'checked':''}> Đã kiểm chứng và duyệt câu</label>${btn('Lưu câu hỏi',`saveQuestion('${esc(id)}')`,'mint')}</div>`);$id('edC').value=String(q.chapter);$id('edL').value=q.lesson;$id('edT').value=q.type;$id('edV').value=q.level;editorTypeChanged(false)}
function editorTypeChanged(clear=true){const t=input('edT');$id('edOp').closest('.field').style.display=['mcq','tf'].includes(t)?'':'none';if(clear)$id('edAns').value=t==='mcq'?'1':t==='tf'?'Đ,S,Đ,S':''}
function saveQuestion(id){let type=input('edT'),ops=input('edOp').split('\n').map(s=>s.trim()).filter(Boolean),av=input('edAns').trim(),ans=av;
if(!input('edText').trim())return toast('Cần nội dung câu hỏi');
if(type==='mcq'){ans=Number(av)-1;if(ops.length!==4||!Number.isInteger(ans)||ans<0||ans>3)return toast('MCQ: nhập đúng 4 phương án và đáp án 1–4')}
if(type==='tf'){ans=av.replace(/\s/g,'').split(',').map(x=>['Đ','D','T','TRUE','1'].includes(x.toUpperCase()));if(ops.length!==4||av.split(',').length!==4)return toast('Đ/S: nhập đúng 4 mệnh đề, đáp án ví dụ Đ,S,Đ,S')}
if(!av)return toast('Chưa nhập đáp án');const old=DATA.questions.find(x=>x.id===id),q=old||{id:uid(),created:new Date().toISOString()};Object.assign(q,{grade:STATE.grade,chapter:Number(input('edC')),lesson:input('edL'),type,level:input('edV'),text:input('edText').trim(),options:ops,answer:ans,explain:input('edExp'),source:input('edSrc'),approved:$id('edApprove').checked});if(!old)DATA.questions.unshift(q);save();closeDialog();refreshBankList();toast('Đã lưu câu hỏi')}
function exportBank(){download('EduPlan_AI_5_7_Ngan_hang_cau_hoi.json',JSON.stringify({version:'5.7',questions:DATA.questions},null,2),'application/json')}
async function importBank(event){let file=event.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),src=Array.isArray(data)?data:(data.questions||[]);if(!Array.isArray(src))throw Error();let add=0;for(let x of src){const g=Number(x.grade??x.g);let c=Number(x.chapter??x.c??0);if(![10,11,12].includes(g)||!CURRICULUM[g][c])continue;let type=QTYPE.includes(x.type)?x.type:'mcq',txt=String(x.text||x.question||'').trim();if(!txt)continue;let op=Array.isArray(x.options)?x.options:(Array.isArray(x.choices)?x.choices:[]);let ans=x.answer??x.correct??0;if(type==='mcq'){if(op.length!==4)continue;if(typeof ans==='string'&&/^[A-D]$/i.test(ans))ans=ans.toUpperCase().charCodeAt(0)-65;ans=Number(ans);if(!(ans>=0&&ans<4))continue}if(type==='tf'&&(!Array.isArray(ans)||ans.length!==4))continue;let sig=(g+'|'+c+'|'+txt.trim().toLowerCase());if(DATA.questions.some(z=>(z.grade+'|'+z.chapter+'|'+z.text.trim().toLowerCase())===sig))continue;DATA.questions.push({id:uid(),grade:g,chapter:c,lesson:x.lesson||CURRICULUM[g][c][1][0],type,level:LEVELS[x.level]?x.level:'TH',text:txt,options:op,answer:ans,explain:x.explain||x.solution||'',source:x.source||'Ngân hàng câu hỏi được nhập',approved:false,created:new Date().toISOString()});add++}save();go('bank');toast('Đã nhập '+add+' câu mới ở trạng thái chờ duyệt')}catch(e){toast('Không đọc được JSON. Hãy kiểm tra cấu trúc câu hỏi.')}finally{event.target.value=''}}

function examsPage(){const ex=DATA.exams.filter(e=>e.grade===STATE.grade).slice().reverse();return `${header('EXAMTRACE AI','Tạo – trộn đề kiểm tra Hóa '+STATE.grade,'Phân phối theo bài, chương, kiểm tra thường xuyên và giữa học kì. Điểm học sinh tối đa 10.')}<div class="card"><h3>Thiết lập đề kiểm tra mới</h3><div class="formgrid"><div class="field"><label>Phạm vi đánh giá</label><select id="examScope" onchange="scopeChange()">${examScopeOptions()}</select></div><div class="field"><label>Chương</label>${chaptersSelect('builderChapter')}</div><div class="field wide"><label>Bài học</label><select id="builderLesson">${lessonOptions(STATE.grade,STATE.chapter,false)}</select></div><div class="field"><label>Số câu nhiều lựa chọn</label><input id="nMC" type="number" min="0" max="40" value="2"></div><div class="field"><label>Số câu Đúng/Sai (4 ý)</label><input id="nTF" type="number" min="0" max="20" value="0"></div><div class="field"><label>Số câu trả lời ngắn</label><input id="nSH" type="number" min="0" max="25" value="0"></div><div class="field"><label>Số câu tự luận</label><input id="nES" type="number" min="0" max="20" value="0"></div><div class="field"><label>Số mã đề</label><input id="codeCount" type="number" min="1" max="8" value="2"></div><div class="field"><label>Tên bài kiểm tra</label><input id="examName" value="Kiểm tra Hóa ${STATE.grade}"></div><div class="field"><label>Thời gian (phút)</label><input id="examMinutes" type="number" min="5" max="180" value="20"></div><div class="field"><label>Yêu cầu năng lực số</label><select id="examNLS"><option value="6">NLS 6 – Ứng dụng AI có trách nhiệm</option>${NLS.slice(0,5).map((s,i)=>`<option value="${i+1}">NLS ${i+1} – ${s}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px">${btn('Áp dụng form 2025: 18–4–6–4','applyExamForm()','secondary')}${btn('Tạo & trộn đề', 'makeExams()','mint')}${btn('Bổ sung từ mẫu thiếu',"prepareAi('generate')",'gold')}</div><div id="examWarnings"></div><p class="smallnote">Mã đề được xáo thứ tự câu và thứ tự lựa chọn. Hệ thống chỉ lấy câu đã duyệt; không tự giả lập câu thiếu. Điểm tự luận cần giáo viên chấm thủ công.</p></div>${STATE.exam?examPreview():''}<div class="card" style="margin-top:15px"><h3>Đề đã tạo gần đây</h3>${ex.length?`<div class="tablewrap"><table class="tbl"><tr><th>Tên</th><th>Mã đề</th><th>Số câu</th><th>Thời điểm</th><th>Thao tác</th></tr>${ex.slice(0,15).map(e=>`<tr><td>${esc(e.title)}</td><td>${e.codes.map(c=>esc(c.code)).join(', ')}</td><td>${e.codes[0]?.items.length||0}</td><td>${date(e.created)}</td><td>${btn('Mở',`openExam('${e.id}')`,'secondary sm')}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có đề nào được tạo.</p>'}</div>${guide('exams')}`}

function poolExam(){let s=input('examScope'),c=Number(input('builderChapter')),l=input('builderLesson');let pool=DATA.questions.filter(q=>q.grade===STATE.grade&&q.approved);if(s==='lesson')return pool.filter(q=>q.chapter===c&&q.lesson===l);if(s==='chapter'||s==='regular')return pool.filter(q=>q.chapter===c);const mid=Math.ceil(CURRICULUM[STATE.grade].length/2);return pool.filter(q=>s==='mid1'?q.chapter<mid:q.chapter>=mid)}
function makeExams(){if(!isTeacher())return toast('Hãy chọn vai trò Giáo viên để tạo đề');let counts={mcq:num(input('nMC')),tf:num(input('nTF')),short:num(input('nSH')),essay:num(input('nES'))};if(Object.values(counts).reduce((a,b)=>a+b,0)===0)return toast('Cần ít nhất một câu');let pool=poolExam(),lack=QTYPE.filter(t=>pool.filter(q=>q.type===t).length<counts[t]);if(lack.length){$id('examWarnings').innerHTML=`<div class="notice warn"><b>Chưa đủ câu đã được duyệt để tạo đề:</b><ul>${lack.map(t=>`<li>${QTNAME[t]}: cần ${counts[t]}, hiện có ${pool.filter(q=>q.type===t).length}; thiếu ${counts[t]-pool.filter(q=>q.type===t).length}.</li>`).join('')}</ul>WebApp sẽ gợi ý câu từ bộ mẫu nội bộ nếu có; giáo viên cần kiểm tra và duyệt trước khi tạo đề.<div style="margin-top:8px">${btn('Mở trợ lý gợi ý câu',"prepareAi('generate')",'gold')}</div></div>`;autoFillMissing(pool,counts,Number(input('builderChapter')),input('builderLesson'),input('examScope'));return}
const chosen=QTYPE.flatMap(t=>sample(pool.filter(q=>q.type===t),counts[t]));let variants=[];const n=Math.min(8,Math.max(1,num(input('codeCount'))));for(let i=0;i<n;i++){const items=shuffle(chosen.map(q=>{let cp=structuredClone(q);if(cp.type==='mcq'){const pairs=cp.options.map((s,j)=>({s,j}));const sp=shuffle(pairs);cp.options=sp.map(z=>z.s);cp.answer=sp.findIndex(z=>z.j===q.answer)}return cp}));variants.push({code:String(101+i),items})}
const ex={id:uid(),grade:STATE.grade,title:input('examName').trim()||'Kiểm tra Hóa '+STATE.grade,scope:input('examScope'),chapter:num(input('builderChapter')),lesson:input('builderLesson'),minutes:num(input('examMinutes')),nls:Number(input('examNLS')),created:new Date().toISOString(),codes:variants};DATA.exams.push(ex);DATA.exams=DATA.exams.slice(-70);save();STATE.exam=ex;STATE.activeCode=variants[0].code;toast('Đã tạo '+n+' mã đề, mỗi đề có '+chosen.length+' câu');go('exams')}
function openExam(id){STATE.exam=DATA.exams.find(e=>e.id===id)||null;STATE.activeCode=STATE.exam?.codes[0]?.code||'';go('exams')}

function downloadExam(){if(!STATE.exam)return;download('EduPlan_De_'+STATE.grade+'_'+STATE.activeCode+'.json',JSON.stringify(STATE.exam,null,2),'application/json')}

function quizPage(){const ex=STATE.quiz||DATA.exams.filter(e=>e.grade===STATE.grade).at(-1)||null;STATE.quiz=ex;if(!ex)return `${header('PHÒNG KIỂM TRA','Làm bài kiểm tra online','Giáo viên tạo đề trong công cụ Tạo & trộn đề trước khi học sinh làm bài.')}<div class="notice warn">Chưa có đề kiểm tra. Vào Tạo & trộn đề để tạo đề hoặc mở liên kết công bố.</div>${btn('Mở Tạo đề',"go('exams')")}${guide('quiz')}`;if(STATE.review)return quizReview();const code=ex.codes.find(x=>x.code===STATE.activeCode)||ex.codes[0];STATE.activeCode=code.code;return `<div class="quizwrap">${header('EXAMTRACE • LÀM BÀI',ex.title,`Hóa ${ex.grade} • Mã đề ${code.code} • ${ex.minutes} phút • ${code.items.length} câu hỏi`)}<div class="card"><div class="two"><div class="field"><label>Mã học sinh (bí danh)</label><input id="studentName" onchange="recordQuizStart()" placeholder="VD: 11A1-08" maxlength="50" value="${esc(sessionStorage.getItem('edpStudent')||'')}"></div><div class="field"><label>Lớp</label><input id="studentClass" onchange="recordQuizStart()" placeholder="VD: 11A1" maxlength="30" value="${esc(sessionStorage.getItem('edpClass')||'')}"></div></div><div class="notice">Lưu bài tự động trên trình duyệt trong khi làm. Bài kiểm tra dạng luyện tập: nội dung và đáp án đã tải về máy học sinh, không có hệ thống chống gian lận thi chính thức.</div><div class="row between"><span><b>Mã đề:</b> ${code.code}</span><span>${code.items.length} câu • tối đa 10 điểm</span></div><div class="prog"><div id="quizProgress" style="width:0%"></div></div>${code.items.map((q,i)=>quizQuestion(q,i)).join('')}<div class="sticky-actions row between"><span class="small muted">Sau khi nộp sẽ hiện toàn bộ đáp án, lời giải và điểm.</span>${btn('NỘP BÀI VÀ XEM KẾT QUẢ',"submitQuiz()",'mint')}</div></div>${guide('quiz')}</div>`}
function safeInputName(q,i){return `q_${i}_${q.id.replace(/[^a-zA-Z0-9]/g,'')}`}
function quizQuestion(q,i){const id=safeInputName(q,i),prev=STATE.quizAnswers[q.id];let body='';if(q.type==='mcq'){body=`<div class="options">${q.options.map((op,j)=>`<label class="option"><input type="radio" name="${id}" value="${j}" ${prev===j?'checked':''} onchange="rememberAnswer('${esc(q.id)}',${j})"><span><b>${'ABCD'[j]}.</b> ${esc(op)}</span></label>`).join('')}</div>`}else if(q.type==='tf'){body=`<div class="options">${q.options.map((s,j)=>`<div class="option"><div style="flex:1">${'abcd'[j]}) ${esc(s)}</div><label><input type="radio" name="${id}_${j}" value="t" ${(prev||[])[j]===true?'checked':''} onchange="rememberTF('${esc(q.id)}',${j},true)"> Đ</label><label><input type="radio" name="${id}_${j}" value="f" ${(prev||[])[j]===false?'checked':''} onchange="rememberTF('${esc(q.id)}',${j},false)"> S</label></div>`).join('')}</div>`}else body=`<div class="field"><label>${q.type==='short'?'Điền đáp án (có thể dùng dấu phẩy thập phân)':'Trình bày lời giải tự luận'}</label>${q.type==='short'?`<input value="${esc(prev??'')}" oninput="rememberAnswer('${esc(q.id)}',this.value)" placeholder="Nhập đáp án">`:`<textarea rows="5" oninput="rememberAnswer('${esc(q.id)}',this.value)" placeholder="Trình bày theo bước, viết đúng công thức, đơn vị...">${esc(prev??'')}</textarea>`}</div>`;return `<div class="question"><div class="row between"><span class="tag">Câu ${i+1} / ${QTNAME[q.type]}</span>${lev(q)}</div><h4 style="margin-top:10px">${esc(q.text)}</h4>${body}</div>`}
function rememberAnswer(id,v){STATE.quizAnswers[id]=v;quizProgress();recordQuizStart()}
function rememberTF(id,j,v){if(!Array.isArray(STATE.quizAnswers[id]))STATE.quizAnswers[id]=[null,null,null,null];STATE.quizAnswers[id][j]=v;quizProgress();recordQuizStart()}
function quizProgress(){const code=STATE.quiz?.codes.find(x=>x.code===STATE.activeCode);if(!code)return;let a=code.items.filter(q=>{let v=STATE.quizAnswers[q.id];return q.type==='tf'?Array.isArray(v)&&v.every(x=>x!==null):v!==undefined&&v!==''}).length;const p=$id('quizProgress');if(p)p.style.width=(a/code.items.length*100).toFixed(1)+'%'}
function normShort(x){let s=String(x??'').trim().toLowerCase().replace(/\s+/g,'').replace(',','.');let n=Number(s);return s!==''&&Number.isFinite(n)?{num:n}:{str:s}}
function checkShort(got,ans){let a=normShort(ans),b=normShort(got);if('num'in a&&'num'in b)return Math.abs(a.num-b.num)<=Math.max(1e-6,Math.abs(a.num)*1e-5);return a.str===b.str}
function scoreQuestions(items,answers){let grades=[],total=items.length;for(let q of items){let got=answers[q.id],credit=0,detail='';if(q.type==='mcq')credit=got===q.answer?1:0;else if(q.type==='tf'){let arr=Array.isArray(got)?got:[];credit=q.answer.reduce((s,v,i)=>s+(arr[i]===v?0.25:0),0)}else if(q.type==='short')credit=checkShort(got,q.answer)?1:0;else detail='Chờ giáo viên chấm';grades.push({id:q.id,credit,detail})}const raw=grades.reduce((s,x)=>s+x.credit,0),score=total?Math.round(raw/total*1000)/100:0;return {grades,score,raw,total,pendingEssay:items.filter(q=>q.type==='essay').length}}
async function recordQuizStart(){const student=input('studentName').trim(),cl=input('studentClass').trim(),ex=STATE.quiz;if(!student||!cl||!ex||student.length>50||cl.length>30)return;let found=DATA.starts.some(x=>x.examId===ex.id&&x.classroom.toLowerCase()===cl.toLowerCase()&&x.student.toLowerCase()===student.toLowerCase());if(found)return;const st={id:uid(),grade:ex.grade,examId:ex.id,student,classroom:cl,time:new Date().toISOString()};DATA.starts.unshift(st);save();if(supabase){try{let key=await hashStudent(st);await cloudRequest('rpc/edp_register_start',{p_student_key:key,p_exam_ref:st.examId,p_grade:st.grade})}catch(e){console.warn('Không đồng bộ được lượt bắt đầu:',e.message)}}}
async function submitQuiz(){if(!STATE.quiz)return;let student=input('studentName').trim(),cl=input('studentClass').trim();if(!student||!cl)return toast('Hãy nhập mã học sinh và lớp trước khi nộp');if(!/^[\p{L}\p{N}_ .-]{1,50}$/u.test(student)||cl.length>30)return toast('Mã học sinh hoặc tên lớp chưa hợp lệ');let ex=STATE.quiz,code=ex.codes.find(c=>c.code===STATE.activeCode)||ex.codes[0];const submitted=code.items.filter(q=>STATE.quizAnswers[q.id]!==undefined).length;if(submitted<code.items.length&&!confirm(`Bạn mới trả lời ${submitted}/${code.items.length} câu. Bạn muốn nộp bài?`))return;let onceKey='edpSubmitted_'+ex.id+'_'+code.code+'_'+student.toLowerCase();if(localStorage.getItem(onceKey)&&!confirm('Mã học sinh này đã nộp trên thiết bị này. Gửi lại một lượt luyện tập mới?'))return;sessionStorage.setItem('edpStudent',student);sessionStorage.setItem('edpClass',cl);await recordQuizStart();
let result=scoreQuestions(code.items,STATE.quizAnswers);const at={id:uid(),examId:ex.id,title:ex.title,grade:ex.grade,code:code.code,student,classroom:cl,time:new Date().toISOString(),answers:structuredClone(STATE.quizAnswers),grades:result.grades,score:result.score,pendingEssay:result.pendingEssay,questions:structuredClone(code.items)};DATA.attempts.unshift(at);save();localStorage.setItem(onceKey,'true');STATE.review=at;if(supabase)try{await cloudSubmitAttempt(at)}catch(e){toast('Đã lưu trên thiết bị; đồng bộ online không thành công: '+e.message)}go('quiz')}
function ansDisplay(q,val){if(val===undefined||val===null)return '<i>Chưa trả lời</i>';if(q.type==='mcq')return (['A','B','C','D'][Number(val)]||'?')+'. '+esc(q.options[Number(val)]||'');if(q.type==='tf')return Array.isArray(val)?val.map(x=>x===null?'—':x?'Đ':'S').join(' – '):'—';return esc(String(val))}
function quizReview(){let at=STATE.review,items=at.questions||[],gradeMap=new Map((at.grades||[]).map(x=>[x.id,x]));return `<div class="quizwrap">${header('BÁO CÁO SAU KIỂM TRA','Kết quả làm bài chi tiết',`${esc(at.student)} • ${esc(at.classroom)} • ${esc(at.title)} • Mã đề ${esc(at.code)}`)}<div class="card"><div class="row between"><div><small class="muted">ĐIỂM ĐẠT ĐƯỢC (TỐI ĐA 10)</small><div class="scorecircle">${Number(at.score).toFixed(2)} / 10</div><p class="muted">${at.pendingEssay?`${at.pendingEssay} câu tự luận đang chờ giáo viên chấm, hiện tạm tính 0 điểm.`:'Hệ thống đã chấm các câu khách quan.'}</p></div><span class="tag approved">Đã nộp lúc ${date(at.time)}</span></div>${btn('In kết quả',"printResult()")}${btn('Xem bài mới',"resetQuiz()",'secondary')}</div><h3 style="margin-top:20px">Toàn bộ câu hỏi, đáp án, lời giải và số điểm từng câu</h3>${items.map((q,i)=>{let got=at.answers?.[q.id],grade=gradeMap.get(q.id)||{credit:0},good=grade.credit===1;return `<div class="question"><div class="row between"><span><b>Câu ${i+1}.</b> ${QTNAME[q.type]}</span><span class="tag ${good?'approved':'pending'}">${grade.credit.toFixed(2)} / 1 điểm trọng số</span></div><h4>${esc(q.text)}</h4>${q.options?.length?`<div class="options">${q.options.map((op,j)=>`<div class="option ${q.type==='mcq'?(j===q.answer?'correct':j===got?'wrong':''):''}">${q.type==='mcq'?'<b>'+('ABCD'[j])+'.</b>':('abcd'[j]+')')} ${esc(op)}${q.type==='tf'?` <span class="muted">— ${q.answer[j]?'Đúng':'Sai'}</span>`:''}</div>`).join('')}</div>`:''}<div class="review-detail"><b>Bài làm của học sinh:</b> ${ansDisplay(q,got)}<br><b>Đáp án đúng / lời giải mẫu:</b> ${ansDisplay(q,q.answer)}<br><b>Giải thích:</b> ${esc(q.explain||'Chưa có lời giải được duyệt.')}<br><b>Mức độ:</b> ${LEVELS[q.level]||'Chưa phân loại'}${q.type==='essay'&&grade.detail!=='Đã chấm'?'<p><i>Điểm câu tự luận cần giáo viên chấm và cập nhật.</i></p>':''}</div></div>`}).join('')}${guide('quiz')}</div>`}
function resetQuiz(){STATE.quizAnswers={};STATE.review=null;go('quiz')}
function printResult(){const area=document.querySelector('.quizwrap')?.cloneNode(true);if(!area)return;area.querySelectorAll('button,details').forEach(n=>n.remove());printHtml(`<html lang="vi"><meta charset="utf-8"><style>body{font-family:'Times New Roman';font-size:13pt;padding:20px}.question{padding:10px;border:1px solid #ccc;margin:10px 0;break-inside:avoid}.option{padding:3px 9px}.review-detail{background:#fafafa;padding:10px}</style>${area.innerHTML}</html>`)}
function resultsPage(){let a=DATA.attempts.filter(x=>x.grade===STATE.grade),participants=new Set(a.map(x=>x.classroom+'|'+x.student.toLowerCase())).size,avg=a.length?a.reduce((s,x)=>s+x.score,0)/a.length:0;return `${header('EXAMTRACE • BÁO CÁO','Kết quả kiểm tra học sinh','Theo dõi lượt tham gia, lượt hoàn thành, điểm tối đa 10 và lỗi sai theo câu hỏi.')}<div class="grid"><div class="card span3 kpi"><small>Lượt truy cập (thiết bị)</small><strong>${DATA.visits}</strong><em>${DATA.visitors.length} thiết bị trình duyệt ghi nhận</em></div><div class="card span3 kpi"><small>Học sinh bắt đầu làm bài Hóa ${STATE.grade}</small><strong>${new Set(DATA.starts.filter(x=>x.grade===STATE.grade).map(x=>x.classroom+'|'+x.student)).size}</strong><em>Bí danh khác nhau theo lớp</em></div><div class="card span3 kpi"><small>Bài kiểm tra đã nộp</small><strong>${a.length}</strong><em>Trong thiết bị hiện tại</em></div><div class="card span3 kpi"><small>Điểm trung bình tạm tính</small><strong>${avg.toFixed(2)}</strong><em>Thang điểm 10</em></div></div><div class="card" style="margin-top:15px"><div class="row between"><h3>Thống kê online dùng chung</h3>${btn('↻ Đồng bộ số liệu',"refreshCloud().then(()=>go('results'))")}</div>${STATE.cloudStats?`<div class="three"><div class="notice ok"><b>${STATE.cloudStats.visits}</b><br>Lượt truy cập toàn hệ thống</div><div class="notice ok"><b>${STATE.cloudStats.participants}</b><br>Học sinh tham gia (${STATE.cloudStats.starts||0} lượt vào đề)</div><div class="notice ok"><b>${STATE.cloudStats.submissions}</b><br>Số bài nộp online</div></div>`:`<div class="notice warn">Chưa có dữ liệu thống kê máy chủ. Kết nối Supabase trong Cấu hình online để tổng hợp nhiều thiết bị; các chỉ số phía trên chỉ phản ánh trình duyệt đang dùng.</div>`}</div><div class="card" style="margin-top:15px"><div class="row between"><h3>Danh sách kết quả trên thiết bị</h3>${btn('Xuất CSV',"exportResults()")}</div>${a.length?`<div class="tablewrap"><table class="tbl"><tr><th>Học sinh</th><th>Lớp</th><th>Đề / mã</th><th>Điểm /10</th><th>Tự luận</th><th>Ngày</th><th>Chi tiết</th></tr>${a.slice(0,100).map(x=>`<tr><td>${esc(x.student)}</td><td>${esc(x.classroom)}</td><td>${esc(x.title)} / ${esc(x.code)}</td><td><b>${x.score.toFixed(2)}</b></td><td>${x.pendingEssay?'Chờ chấm':'Đã tính'}</td><td>${date(x.time)}</td><td>${btn('Xem',`openReview('${x.id}')`,'secondary sm')}${x.pendingEssay&&isTeacher()?btn('Chấm TL',`gradeEssay('${x.id}')`,'gold sm'):''}</td></tr>`).join('')}</table></div>`:'<p class="muted">Chưa có học sinh nộp bài trên thiết bị này.</p>'}<p class="smallnote">Báo cáo câu hỏi chi tiết được lưu tại thiết bị; hệ thống online lưu điểm và mã học sinh dạng bí danh để giáo viên xem trên nhiều thiết bị khi đã đăng nhập.</p></div>${STATE.cloudAttempts.length&&sessionStorage.getItem('edpTeacherToken')?`<div class="card" style="margin-top:15px"><h3>Kết quả online (giáo viên đã đăng nhập)</h3><div class="tablewrap"><table class="tbl"><tr><th>Mã học sinh</th><th>Lớp</th><th>Đề</th><th>Điểm tạm tính /10</th><th>Thời gian</th></tr>${STATE.cloudAttempts.filter(a=>a.grade===STATE.grade).map(a=>`<tr><td>${esc(a.student_code)}</td><td>${esc(a.class_code)}</td><td>${esc(a.exam_title)}</td><td>${a.score}</td><td>${date(a.submitted_at)}</td></tr>`).join('')}</table></div></div>`:''}<div class="card" style="margin-top:15px"><h3>Nhóm nội dung học sinh thường sai</h3>${mistakeStats(a)}</div>${guide('results')}`}
function mistakeStats(arr){let stats=new Map();for(let a of arr){const gr=new Map((a.grades||[]).map(x=>[x.id,x.credit]));for(let q of(a.questions||[])){const key=q.lesson+'|'+q.level;let val=stats.get(key)||{lesson:q.lesson,level:q.level,wrong:0,all:0};val.all++;if((gr.get(q.id)||0)<1)val.wrong++;stats.set(key,val)}}return [...stats.values()].sort((a,b)=>b.wrong-a.wrong).slice(0,8).map(x=>`<div class="list-item row between"><div><b>${esc(x.lesson)}</b><br><small>${LEVELS[x.level]||x.level}</small></div><span class="tag pending">${x.wrong}/${x.all} lượt chưa đạt tối đa</span></div>`).join('')||'<p class="muted">Chưa đủ bài nộp để thống kê lỗi sai.</p>'}
function openReview(id){let at=DATA.attempts.find(a=>a.id===id);if(!at)return;STATE.review=at;STATE.quiz=DATA.exams.find(e=>e.id===at.examId)||{id:at.examId,grade:at.grade,title:at.title,codes:[{code:at.code,items:at.questions}]};STATE.activeCode=at.code;go('quiz');STATE.review=at;$id('content').innerHTML=quizReview()}
function gradeEssay(id){if(!isTeacher())return toast('Chỉ giáo viên chấm tự luận');let at=DATA.attempts.find(a=>a.id===id);if(!at)return;const qs=at.questions.filter(q=>q.type==='essay');if(!qs.length)return toast('Bài không có câu tự luận');dialog(`<h3>Chấm tự luận: ${esc(at.student)} – ${esc(at.title)}</h3><p class="small muted">Mỗi câu được chấm từ 0 đến 1 điểm trọng số. Điểm toàn bài được quy đổi thang 10.</p>${qs.map((q,i)=>{let g=at.grades.find(x=>x.id===q.id);return `<div class="question"><b>Câu tự luận ${i+1}: ${esc(q.text)}</b><p class="muted small">Bài làm học sinh:</p><div class="resultbox">${esc(at.answers[q.id]||'Chưa làm')}</div><p><b>Lời giải tham khảo:</b> ${esc(q.explain||q.answer)}</p><label>Điểm (0–1)</label><input type="number" min="0" max="1" step="0.25" id="essayPoint_${i}" value="${g?.detail==='Đã chấm'?g.credit:0}"></div>`}).join('')}<button class="btn mint" onclick="saveEssayScore('${esc(id)}')">Lưu điểm tự luận</button>`)}
function saveEssayScore(id){let at=DATA.attempts.find(a=>a.id===id);if(!at)return;let qs=at.questions.filter(q=>q.type==='essay');for(let i=0;i<qs.length;i++){let el=$id('essayPoint_'+i),v=Number(el.value);if(el.value===''||!Number.isFinite(v)||v<0||v>1)return toast('Điểm từng câu phải từ 0 đến 1');let grade=at.grades.find(x=>x.id===qs[i].id);grade.credit=v;grade.detail='Đã chấm'}at.pendingEssay=0;at.score=Math.round(at.grades.reduce((s,x)=>s+x.credit,0)/at.questions.length*1000)/100;save();closeDialog();toast('Đã chấm tự luận, cập nhật điểm /10 trên thiết bị.');go('results')}
function exportResults(){const rows=[['Mã HS','Lớp','Bài kiểm tra','Mã đề','Điểm /10','Tự luận chờ chấm','Thời gian'],...DATA.attempts.filter(x=>x.grade===STATE.grade).map(x=>[x.student,x.classroom,x.title,x.code,x.score,x.pendingEssay,x.time])];download('EduPlan_Ket_qua_Hoa_'+STATE.grade+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function worksheetPage(){return `${header('PLANFLOW • HỌC LIỆU','Tạo phiếu học tập Hóa '+STATE.grade,'Tạo phiếu theo bài, theo chương hoặc dạng ôn tập / kiểm tra; có mức độ và yêu cầu NLS/AI.')}<div class="card"><div class="formgrid"><div class="field"><label>Chương</label><select id="wsChapter" onchange="wsChapterChange()">${chaptersOptions()}</select></div><div class="field wide"><label>Chọn bài</label><select id="wsLesson">${lessonOptions(STATE.grade,STATE.chapter,true)}</select></div><div class="field"><label>Dạng phiếu</label><select id="wsScope"><option>Phiếu học tập từng bài</option><option>Phiếu ôn tập chương</option><option>Phiếu kiểm tra thường xuyên</option><option>Phiếu ôn giữa kì I</option><option>Phiếu ôn giữa kì II</option></select></div><div class="field"><label>Số câu hỏi</label><input id="wsCount" type="number" value="5" min="1" max="30"></div><div class="field"><label>Mức độ ưu tiên</label><select id="wsLevel"><option value="all">Đủ 4 mức độ</option>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field wide"><label>Năng lực số / AI</label><select id="wsNls">${NLS.map((s,i)=>`<option value="${i+1}">${i+1}. ${s}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px">${btn('Tạo phiếu học tập',"makeWorksheet()",'mint')}${btn('Gợi ý tình huống',"prepareAi('worksheet')",'gold')}</div><div id="wsMsg"></div></div><div id="wsPreview"></div>${guide('worksheet')}`}
function wsChapterChange(){STATE.chapter=num(input('wsChapter'));$id('wsLesson').innerHTML=lessonOptions(STATE.grade,STATE.chapter,true)}
let WS=null;
function makeWorksheet(){const g=STATE.grade,c=num(input('wsChapter')),l=input('wsLesson'),sc=input('wsScope'),level=input('wsLevel'),n=Math.max(1,Math.min(30,num(input('wsCount')))),nls=num(input('wsNls'));let pool=DATA.questions.filter(q=>q.grade===g&&q.approved);if(sc.includes('giữa kì')){const m=Math.ceil(gCh().length/2),s=sc.endsWith('I')?0:m,e=sc.endsWith('I')?m:gCh().length;pool=pool.filter(q=>q.chapter>=s&&q.chapter<e)}else{pool=pool.filter(q=>q.chapter===c);if(sc.includes('từng bài')&&l)pool=pool.filter(q=>q.lesson===l)}if(level!=='all')pool=pool.filter(q=>q.level===level);const selected=sample(pool,n);if(!selected.length){$id('wsMsg').innerHTML='<div class="notice warn">Chưa có câu được duyệt phù hợp. Bổ sung từ ngân hàng nội bộ hoặc nhập câu chính xác từ nguồn tin cậy, sau đó giáo viên duyệt.</div>';return}WS={grade:g,chapter:c,lesson:l,scope:sc,nls,questions:selected};$id('wsMsg').innerHTML=selected.length<n?`<div class="notice warn">Chỉ tìm được ${selected.length}/${n} câu đã duyệt. Bạn có thể xem mẫu bổ sung trong Trợ lý Hóa học.</div>`:'';let html=worksheetHtml(WS);$id('wsPreview').innerHTML=`<div class="card" style="margin-top:15px"><div class="row between"><h3>Xem trước phiếu học tập</h3><div class="row">${btn('In / lưu PDF',"printWorksheet()")}${btn('Tải phiếu HTML',"exportWorksheet()",'secondary')}</div></div><div style="padding:17px;border:1px solid #d9e4ed;border-radius:12px">${html}</div></div>`}
function worksheetHtml(w){return `<div style="text-align:center"><b>TRƯỜNG THPT HÒN ĐẤT</b><h2 style="margin:7px 0">PHIẾU HỌC TẬP HÓA ${w.grade}</h2><p>${esc(w.scope)} • Chương ${w.chapter+1}: ${esc(CURRICULUM[w.grade][w.chapter][0])}</p><p>Họ tên: ....................................................... Lớp: .......................</p></div><hr><p><b>Mục tiêu:</b> Ôn luyện kiến thức SGK KNTT; giải thích bản chất và vận dụng phương pháp giải.</p><p><b>Năng lực số:</b> ${esc(NLS[w.nls-1])}. Học sinh đối chiếu ít nhất một nguồn uy tín và nêu cách kiểm chứng thông tin AI.</p>${w.questions.map((q,i)=>`<div style="margin:18px 0"><b>Câu ${i+1}.</b> ${esc(q.text)} <small>(${LEVELS[q.level]})</small>${['mcq','tf'].includes(q.type)?q.options.map((o,j)=>`<p style="margin:5px 15px">${q.type==='mcq'?('ABCD'[j]):('abcd'[j])}. ${esc(o)} ${q.type==='tf'?' □ Đ / □ S':''}</p>`).join(''):'<p style="border-bottom:1px dotted #bbb;height:33px"></p>'}</div>`).join('')}<p><b>Hoạt động NLS/AI:</b> Tìm thêm một nguồn tài liệu học thuật liên quan đến bài, ghi địa chỉ, năm xuất bản (nếu có), chỉ ra một điểm cần kiểm chứng.</p><p><i>Giáo viên: Lê Bá Nhẫn – Trường THPT Hòn Đất • EduPlan AI 5.7</i></p>`}
function printWorksheet(){if(!WS)return;printHtml(`<html lang="vi"><meta charset="utf-8"><style>body{font:14pt 'Times New Roman';max-width:820px;margin:25px auto;line-height:1.35}</style>${worksheetHtml(WS)}</html>`)}
function exportWorksheet(){if(!WS)return;download('EduPlan_Phieu_hoc_tap_Hoa_'+WS.grade+'.html',`<!doctype html><html lang="vi"><meta charset="utf-8"><title>Phiếu học tập</title><body style="font:14pt 'Times New Roman';max-width:850px;margin:25px auto;line-height:1.5">${worksheetHtml(WS)}</body></html>`,'text/html;charset=utf-8')}
function practicePage(){const qs=DATA.questions.filter(q=>q.grade===STATE.grade&&q.approved&&q.type!=='essay');return `${header('BÀI TẬP TƯƠNG TÁC','Giải bài tập Hóa ${STATE.grade} online','Làm câu chọn lọc, xem hướng dẫn và phân tích lỗi sai. Bài khác có thể gửi Trợ lý AI để giải từng bước.')}<div class="card"><div class="row between"><h3>Luyện tập nhanh</h3>${btn('Đổi câu ngẫu nhiên',"randomPractice()")}</div><div class="formgrid"><div class="field wide"><label>Chương</label><select id="practiceChap" onchange="randomPractice(true)"><option value="all">Tất cả chương</option>${chaptersOptions()}</select></div><div class="field wide"><label>Mức độ</label><select id="practiceLevel" onchange="randomPractice(true)"><option value="all">Tất cả</option>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div id="practiceQuestion">${qs.length?`<div class="notice">Nhấn “Đổi câu ngẫu nhiên” để bắt đầu luyện tập theo chương và mức độ.</div>`:'<div class="notice warn">Cần thêm câu hỏi được duyệt vào ngân hàng.</div>'}</div></div><div class="card" style="margin-top:15px"><h3>Giải bài tập tự luận và bài tính toán online</h3><p class="muted small">Trợ lý tích hợp xử lý những dạng bài mẫu đã được lập trình; bài ngoài phạm vi sẽ cung cấp phương pháp và hướng tra cứu. Không cần nhập khóa API.</p><textarea id="practiceOwn" placeholder="Ví dụ: Cho 5,6 g Fe phản ứng hết với HCl dư. Tính thể tích H₂ (đkc) ..." rows="4"></textarea><div class="row" style="margin-top:10px">${btn('Giải bằng trợ lý tích hợp',"solvePracticeAI()",'mint')}${btn('Tra cứu tài liệu nguồn',"go('resources')")}</div></div>${guide('practice')}`}
let PRACTICE_Q=null;
function randomPractice(preserve=false){const c=preserve?input('practiceChap'):input('practiceChap'),lv=input('practiceLevel');let arr=DATA.questions.filter(q=>q.grade===STATE.grade&&q.approved&&q.type==='mcq'&&(c==='all'||q.chapter===Number(c))&&(lv==='all'||q.level===lv));let q=sample(arr,1)[0];PRACTICE_Q=q||null;$id('practiceQuestion').innerHTML=q?`<div class="question"><div class="pillrow">${lev(q)} <span class="tag">${esc(q.lesson)}</span></div><h4>${esc(q.text)}</h4><div class="options">${q.options.map((s,j)=>`<label class="option"><input type="radio" name="pr" value="${j}"><span>${'ABCD'[j]}. ${esc(s)}</span></label>`).join('')}</div><div class="row" style="margin-top:12px">${btn('Kiểm tra lời giải',"checkPractice()",'mint')}</div><div id="practiceResponse"></div></div>`:'<div class="notice warn">Không có câu trắc nghiệm phù hợp với bộ lọc này.</div>'}
function checkPractice(){if(!PRACTICE_Q)return;const chosen=document.querySelector('input[name="pr"]:checked');if(!chosen)return toast('Chọn một đáp án để kiểm tra');let good=Number(chosen.value)===PRACTICE_Q.answer;$id('practiceResponse').innerHTML=`<div class="notice ${good?'ok':'warn'}"><b>${good?'Chính xác!':'Cần xem lại kiến thức.'}</b><p>Đáp án đúng: <b>${'ABCD'[PRACTICE_Q.answer]}.</b> ${esc(PRACTICE_Q.options[PRACTICE_Q.answer])}</p><p><b>Giải thích:</b> ${esc(PRACTICE_Q.explain||'')}</p><p><b>Gợi ý sửa lỗi:</b> ${good?'Liên hệ với bài vận dụng cao hơn.':'Chú ý từ khóa, cân bằng phương trình và điều kiện áp dụng; xem lại kiến thức '+esc(PRACTICE_Q.lesson)+'.'}</p></div>`}
function solvePracticeAI(){const s=input('practiceOwn').trim();if(!s)return toast('Hãy nhập đề bài để giải');STATE.aiLast=s;go('assistant');$id('aiMode').value='solve';$id('aiText').value=s}

const CHEM_TOPICS=[
 {re:/hno3|nitric|nitrat|nitrate/i,title:'Nitric acid (HNO₃): tính acid và tính oxi hóa',theory:'HNO₃ là acid mạnh và là chất oxi hóa mạnh. Khi phản ứng với kim loại, N(+5) thường bị khử thành NO₂, NO hoặc sản phẩm khác tùy nồng độ và điều kiện; không mặc định sinh H₂.',eq:'Cu + 4HNO₃(đặc) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O; 3Cu + 8HNO₃(loãng) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O.',trap:'Tránh áp dụng máy móc quy tắc kim loại + acid → H₂ cho HNO₃.'},
 {re:/h2so4|sulfuric|sunfuric|axit sunfuric/i,title:'Sulfuric acid (H₂SO₄)',theory:'H₂SO₄ loãng thể hiện tính acid mạnh; H₂SO₄ đặc nóng vừa là acid vừa có tính oxi hóa mạnh. Ion sulfate được nhận biết bằng Ba²⁺ sau khi loại trừ các ion gây nhiễu.',eq:'Zn + H₂SO₄(loãng) → ZnSO₄ + H₂↑; Cu + 2H₂SO₄(đặc, nóng) → CuSO₄ + SO₂↑ + 2H₂O; Ba²⁺ + SO₄²⁻ → BaSO₄↓.',trap:'Phân biệt H₂SO₄ đặc, nóng với H₂SO₄ loãng; không suy diễn cùng sản phẩm khí.'},
 {re:/nh3|ammonia|amoniac|ammonium|nh4/i,title:'Ammonia và muối ammonium',theory:'NH₃ là base yếu theo Brønsted; phân tử có một cặp electron chưa tham gia liên kết. Ion NH₄⁺ nhường proton và thể hiện tính acid yếu.',eq:'NH₃ + H₂O ⇌ NH₄⁺ + OH⁻; NH₄⁺ + OH⁻ → NH₃↑ + H₂O (khi đun nóng).',trap:'Không nhầm tính base yếu của NH₃ với NaOH; NH₃ không phân li hoàn toàn.'},
 {re:/so2|sulfur dioxide|luu huynh dioxide/i,title:'Sulfur dioxide (SO₂)',theory:'Trong SO₂, S có số oxi hóa +4 nên SO₂ có thể vừa là chất khử vừa là chất oxi hóa. SO₂ là oxide acid, gây tác động môi trường khi phát thải.',eq:'SO₂ + 2NaOH → Na₂SO₃ + H₂O; 2SO₂ + O₂ ⇌ 2SO₃ (xúc tác, nhiệt độ thích hợp).',trap:'Không khẳng định SO₂ chỉ có tính khử hoặc chỉ có tính oxi hóa.'},
 {re:/cân bằng|can bang|le chatelier|hằng số cân bằng|kc\b/i,title:'Cân bằng hóa học',theory:'Tại cân bằng động, tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch; nồng độ các chất không đổi theo thời gian nhưng không nhất thiết bằng nhau.',eq:'N₂(g) + 3H₂(g) ⇌ 2NH₃(g). Với phản ứng này, tăng áp suất (nhiệt độ không đổi) thuận lợi cho chiều giảm tổng số mol khí.',trap:'Chất xúc tác làm tăng tốc độ đạt cân bằng nhưng không làm thay đổi hằng số cân bằng ở nhiệt độ xác định.'},
 {re:/\bph\b|poh|hydrogen ion|acid.base|axit.bazo|axit.bazơ/i,title:'pH và cân bằng trong dung dịch',theory:'Ở 25 °C: pH = −log₁₀[H₃O⁺], pOH = −log₁₀[OH⁻], pH + pOH = 14 với dung dịch nước lý tưởng loãng. pH < 7: acid; pH = 7: trung tính; pH > 7: base.',eq:'HCl 0,001 M phân li gần như hoàn toàn → [H₃O⁺] ≈ 10⁻³ M → pH ≈ 3.',trap:'Không dùng pH + pOH = 14 cho mọi nhiệt độ; điều kiện nêu là 25 °C.'},
 {re:/oxi hóa.khử|oxy hóa|số oxi hóa|so oxi hoa|chất khử|chất oxi hóa/i,title:'Phản ứng oxi hóa – khử',theory:'Oxi hóa là quá trình nhường electron, số oxi hóa tăng; khử là quá trình nhận electron, số oxi hóa giảm. Chất khử bị oxi hóa, chất oxi hóa bị khử.',eq:'Mg⁰ → Mg²⁺ + 2e; O₂ + 4e → 2O²⁻; 2Mg + O₂ → 2MgO.',trap:'Không nhầm chất khử là chất nhận electron. Cần cân bằng cả electron và nguyên tố.'},
 {re:/electron|proton|neutron|cấu tạo nguyên tử|nguyen tu|cấu hình electron/i,title:'Cấu tạo nguyên tử và electron',theory:'Z = số proton; với nguyên tử trung hòa, số electron = Z; số neutron N = A − Z với đồng vị có số khối A.',eq:'²³₁₁Na có 11 proton, 11 electron và 12 neutron. Na⁺ có 10 electron.',trap:'Ion không nhất thiết có số electron bằng số proton.'},
 {re:/bảng tuần hoàn|bang tuan hoan|chu kì|nhóm a|ban kinh nguyen tu/i,title:'Bảng tuần hoàn',theory:'Các nguyên tố được sắp xếp theo chiều tăng Z. Trong một chu kì chính, bán kính nguyên tử nhìn chung giảm từ trái sang phải; trong nhóm A thường tăng từ trên xuống.',eq:'Na (Z=11): chu kì 3, nhóm IA; Mg (Z=12): chu kì 3, nhóm IIA.',trap:'Không đánh đồng số lớp electron (chu kì) với số electron hóa trị (nhóm A).'},
 {re:/liên kết ion|lien ket ion|cộng hóa trị|cong hoa tri|hydrogen bond|octet/i,title:'Liên kết hóa học',theory:'Liên kết ion chủ yếu do lực hút tĩnh điện giữa các ion trái dấu; liên kết cộng hóa trị do các nguyên tử dùng chung một hoặc nhiều cặp electron.',eq:'Na → Na⁺ + e; Cl + e → Cl⁻; Na⁺ và Cl⁻ tạo tinh thể NaCl. H–H: hai nguyên tử H dùng chung một cặp electron.',trap:'Không coi mọi liên kết phân cực là liên kết ion.'},
 {re:/tốc độ phản ứng|toc do phan ung|xúc tác|xuc tac/i,title:'Tốc độ phản ứng',theory:'Tốc độ phản ứng phụ thuộc bản chất chất phản ứng, nồng độ, áp suất (khí), nhiệt độ, bề mặt tiếp xúc và chất xúc tác.',eq:'Nghiền nhỏ CaCO₃ có thể làm tăng tốc độ phản ứng với dung dịch HCl do tăng diện tích tiếp xúc.',trap:'Chất xúc tác không bị tiêu hao ròng trong phản ứng tổng quát, và không làm thay đổi ΔrH.'},
 {re:/enthalpy|nhiệt phản ứng|nhiệt tạo thành|tỏa nhiệt|thu nhiệt/i,title:'Biến thiên enthalpy',theory:'Với quy ước ΔᵣH = H(sản phẩm) − H(chất phản ứng): phản ứng tỏa nhiệt có ΔᵣH < 0, phản ứng thu nhiệt có ΔᵣH > 0.',eq:'ΔᵣH° = ΣνΔfH°(sản phẩm) − ΣνΔfH°(chất tham gia).',trap:'Không đảo dấu ΔᵣH nếu chưa đảo chiều phương trình hóa học.'},
 {re:/halogen|chlorine|cl2|f2|bromine|br2|iodine|i2/i,title:'Halogen và hydrogen halide',theory:'Nhóm halogen gồm F, Cl, Br, I,...; tính oxi hóa của halogen nhìn chung giảm khi đi từ F₂ đến I₂. Halogen mạnh hơn có thể đẩy halogen yếu hơn ra khỏi dung dịch muối halide phù hợp.',eq:'Cl₂ + 2KBr → 2KCl + Br₂.',trap:'Phản ứng thế halogen phụ thuộc dãy tính oxi hóa, không phải mọi cặp đều xảy ra.'},
 {re:/alkane|anken|alkene|ankin|alkyne|hydrocarbon|benzen|benzene/i,title:'Hydrocarbon',theory:'Alkane mạch hở có công thức chung CₙH₂ₙ₊₂. Alkene mạch hở có một liên kết đôi: CₙH₂ₙ. Benzene có công thức C₆H₆, có tính thơm.',eq:'CH₄ + 2O₂ → CO₂ + 2H₂O; C₂H₄ + Br₂ → C₂H₄Br₂.',trap:'Không suy luận mọi hydrocarbon làm mất màu nước bromine như alkene.'},
 {re:/alcohol|ancol|ethanol|methanol|phenol/i,title:'Alcohol và phenol',theory:'Alcohol no, đơn chức, mạch hở có dạng CₙH₂ₙ₊₁OH. Phenol có nhóm –OH gắn trực tiếp vào vòng benzene; phenol có tính acid yếu hơn acid carboxylic.',eq:'2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂↑; C₆H₅OH + NaOH → C₆H₅ONa + H₂O.',trap:'Ethanol không phản ứng với NaOH trong dung dịch theo cơ chế trung hòa thông thường.'},
 {re:/aldehyde|ketone|carbonyl|carboxylic|acid acetic|acetic acid/i,title:'Hợp chất carbonyl và carboxylic acid',theory:'Aldehyde có nhóm –CHO; ketone có nhóm C=O gắn với hai gốc carbon. Carboxylic acid có nhóm –COOH và phản ứng với carbonate/hydrogencarbonate giải phóng CO₂.',eq:'CH₃COOH + NaHCO₃ → CH₃COONa + CO₂↑ + H₂O.',trap:'Không áp dụng tính chất oxi hóa của aldehyde cho mọi ketone.'},
 {re:/ester|lipid|chất béo|xà phòng/i,title:'Ester, lipid và xà phòng hóa',theory:'Ester đơn chức thường có nhóm –COO–. Trong môi trường kiềm, phản ứng thủy phân ester thường không thuận nghịch do tạo muối carboxylate.',eq:'CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH.',trap:'Không nhầm sản phẩm xà phòng hóa ester với thủy phân trong môi trường acid.'},
 {re:/carbohydrate|glucose|fructose|saccharose|maltose|tinh bột|cellulose/i,title:'Carbohydrate',theory:'Glucose có công thức C₆H₁₂O₆; saccharose và maltose có công thức C₁₂H₂₂O₁₁; tinh bột và cellulose có mắt xích dạng (C₆H₁₀O₅)ₙ.',eq:'C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ (lên men, điều kiện thích hợp).',trap:'Không đồng nhất cấu tạo và tính chất của tinh bột với cellulose.'},
 {re:/amine|amino acid|peptide|protein|enzyme|enzym/i,title:'Amine, amino acid, peptide và protein',theory:'Amine là dẫn xuất hình thức của NH₃ khi thay H bằng gốc hydrocarbon; amino acid chứa nhóm amino và carboxyl. Liên kết peptide là –CO–NH– nối các gốc amino acid.',eq:'NH₂CH₂COOH + NaOH → NH₂CH₂COONa + H₂O.',trap:'Không mặc định mọi amine đều có tính base mạnh ngang nhau.'},
 {re:/polymer|polime|nhựa|trùng hợp|trung hop/i,title:'Polymer',theory:'Polymer có phân tử khối lớn, gồm nhiều đơn vị cấu trúc lặp lại. Trùng hợp và trùng ngưng là hai kiểu tạo polymer có cơ chế khác nhau.',eq:'nCH₂=CH₂ → (–CH₂–CH₂–)ₙ (polyethylene).',trap:'Không ghi H₂O là sản phẩm phụ của phản ứng trùng hợp polyethylene.'},
 {re:/điện phân|dien phan|faraday|điện cực|pin điện/i,title:'Điện hóa và điện phân',theory:'Ở cathode xảy ra quá trình khử; ở anode xảy ra quá trình oxi hóa. Định luật Faraday: n(e) = It/F; với F ≈ 96485 C/mol e.',eq:'Cu²⁺ + 2e → Cu; m(Cu) = M(Cu)·I·t/(2F) nếu hiệu suất 100% và không có quá trình cạnh tranh.',trap:'Không nhầm cathode luôn mang dấu âm: dấu điện cực phụ thuộc pin điện/điện phân.'},
 {re:/ăn mòn|kim loại|metal|hợp kim|cao su|fe.*hcl/i,title:'Kim loại và ăn mòn',theory:'Ăn mòn hóa học xảy ra do phản ứng trực tiếp; ăn mòn điện hóa cần vùng anode, cathode và môi trường dẫn điện. Có thể chống ăn mòn bằng bảo vệ bề mặt và bảo vệ điện hóa.',eq:'Fe + 2HCl → FeCl₂ + H₂↑ (trong điều kiện HCl loãng, Fe dư/đủ).',trap:'Không nhầm tính khử của kim loại với việc mọi kim loại đều phản ứng được với nước.'},
 {re:/kim loại kiềm|kim loại kiềm thổ|nhóm ia|nhóm iia|ca\(oh\)2|naoh/i,title:'Nguyên tố nhóm IA, IIA',theory:'Kim loại kiềm (nhóm IA, trừ H) có một electron hóa trị; kim loại kiềm thổ (nhóm IIA) có hai electron hóa trị. Hợp chất của Na, K, Ca có nhiều ứng dụng thực tiễn.',eq:'2Na + 2H₂O → 2NaOH + H₂↑; CaCO₃ + 2HCl → CaCl₂ + CO₂↑ + H₂O.',trap:'Không dùng thí nghiệm phản ứng kim loại kiềm với nước khi chưa có điều kiện an toàn và giám sát.'},
 {re:/phức chất|phuc chat|chuyển tiếp|transition|fe3|fe2/i,title:'Kim loại chuyển tiếp và phức chất',theory:'Kim loại chuyển tiếp dãy thứ nhất thường có nhiều số oxi hóa và có thể hình thành phức chất. Trong phức chất, ion/nguyên tử trung tâm liên kết với phối tử.',eq:'Fe²⁺ → Fe³⁺ + e (quá trình oxi hóa).',trap:'Không đồng nhất số oxi hóa của kim loại với số phối trí trong một phức chất.'}

function chemFill(t,v){return String(t).replace(/\{([a-z]\w*)\}/g,(_,k)=>String(v[k]??''))}
function chemNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[₀-₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x))}
function chemFormatNum(v){return Number(v.toFixed(5)).toLocaleString('vi-VN',{maximumFractionDigits:5})}
function chemMassProblem(question){
 const s=chemNorm(question).replace(/,/g,'.');
 const fe=s.match(/(?:cho|co|dung|tu)\s*(\d+(?:\.\d+)?)\s*g\s*(fe|sat)\b/);
 if(fe && /hcl|hydrochloric|axit clohidric/.test(s)){
  let m=Number(fe[1]);if(!(m>0&&m<1e6))return null;
  const n=m/56;let out=`Bài toán Fe + HCl (giả sử HCl loãng dư, Fe phản ứng hoàn toàn).\n1. PTHH: Fe + 2HCl → FeCl₂ + H₂↑.\n2. n(Fe) = ${chemFormatNum(m)}/56 = ${chemFormatNum(n)} mol.\n3. Theo PTHH: n(H₂) = n(Fe) = ${chemFormatNum(n)} mol.`;
  if(/the tich|lit|liter|l\s*h2|h2.*l\b/.test(s)){
   out+=`\n4. Ở điều kiện chuẩn 25 °C, 1 bar: V(H₂) = ${chemFormatNum(n)} × 24,79 = ${chemFormatNum(n*24.79)} L.`;
   if(/dktc|0\s*°?c|0\s*do c/.test(s))out+=`\n   Nếu đề quy định 0 °C, 1 atm (đktc cũ) thì V(H₂) ≈ ${chemFormatNum(n*22.4)} L.`;
   out+='\nKiểm tra kỹ nhiệt độ và áp suất đề bài; không dùng 22,4 L/mol thay cho 24,79 L/mol khi đề ghi điều kiện chuẩn 25 °C, 1 bar.';
  } else {out+='\nNếu cần thể tích khí, hãy nêu rõ điều kiện nhiệt độ và áp suất.'}
  return out;
 }
 const ph=s.match(/\bph\s*(?:=|bang|la)\s*(\d+(?:\.\d+)?)/);
 if(ph){const p=Number(ph[1]);if(p>=0&&p<=14)return `Với pH = ${chemFormatNum(p)}, ở 25 °C và dung dịch nước loãng:\n[H₃O⁺] = 10^(−pH) = ${10**(-p)} M.\npOH ≈ 14 − ${chemFormatNum(p)} = ${chemFormatNum(14-p)}.\nLưu ý: Các công thức này giả định hoạt độ được xấp xỉ bởi nồng độ.`}
 return null;
}
function chemTopicSearch(query){const raw=String(query||'').replace(/[₀-₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x));return CHEM_TOPICS.find(x=>x.re.test(raw))||null}
function chemPromptResult(mode,query,req){
 const topic=chemTopicSearch(query),chapter=CURRICULUM[req.grade]?.[req.chapter],label=chapter?.[0]||'chủ đề Hóa học đang học';
 if(mode==='solve'){
  const solved=chemMassProblem(query);if(solved)return {text:'HƯỚNG DẪN GIẢI THEO DỮ KIỆN NHẬN DIỆN\n'+solved+'\n\nHãy đối chiếu lại điều kiện phản ứng và đơn vị trong đề.',sources:[]};
 }
 if(mode==='research')return {text:`TRA CỨU TÀI LIỆU CHO: ${query}\n• Ưu tiên cổng sách của NXB Giáo dục, Bộ GDĐT, PhET, ACS, RSC, IChO.\n• Mở các liên kết xác thực bên dưới, tự kiểm tra tên tác giả, nguồn công bố và bản quyền.\n• Chế độ không khóa API không tự tải và đọc nội dung từ mọi trang web; không tạo trích dẫn giả.`,sources:SOURCES.filter(x=>/Sách giáo khoa|Tham khảo|Chương trình|HSG/.test(x.type)).slice(0,5).map(x=>({title:x.name,url:x.url}))};
 if(mode==='worksheet'){
  const pool=DATA.questions.filter(x=>x.grade===req.grade&&x.chapter===req.chapter&&x.approved).slice(0,5);
  return {text:`GỢI Ý THIẾT KẾ PHIẾU HỌC TẬP – ${label}\n1. Khởi động: nêu tình huống gần gũi, dự đoán hiện tượng và giải thích.\n2. Khám phá: phân tích khái niệm và hiện tượng bằng dữ kiện/SGK.\n3. Luyện tập: ${pool.length?pool.map((q,i)=>`\n   Câu ${i+1}: ${q.text}`).join(''):'chưa có câu hỏi được duyệt cho chương này; cần nhập thêm trước khi giao phiếu.'}\n4. Vận dụng: học sinh tìm một nguồn học thuật, ghi URL và đối chiếu bằng chứng.\n5. NLS/AI: học sinh nêu 1 thông tin thiếu kiểm chứng do công cụ số có thể tạo ra.\n\nĐây là khung gợi ý; dùng mục “Tạo phiếu học tập” để xuất phiếu hoàn chỉnh.`,sources:[]};
 }
 if(topic)return {text:`${topic.title.toUpperCase()}\n\nBẢN CHẤT KIẾN THỨC\n${topic.theory}\n\nPHƯƠNG TRÌNH / VÍ DỤ MINH HỌA\n${topic.eq}\n\nBẪY VÀ LỖI SAI PHỔ BIẾN\n${topic.trap}\n\nTỰ KIỂM TRA\nViết lại phương trình và giải thích vai trò mỗi chất; kiểm tra bảo toàn nguyên tố và điện tích.\n\nGhi chú: Đây là kiến thức trong thư viện tích hợp, không phải câu trả lời từ dịch vụ AI sinh nội dung trực tuyến.`,sources:[]};
 const near=DATA.questions.filter(x=>x.grade===req.grade&&x.chapter===req.chapter&&x.approved).slice(0,2);
 return {text:`CHỦ ĐỀ: Hóa ${req.grade} – ${label}\n\nTrợ lý tích hợp chưa có lời giải được kiểm chứng cho toàn bộ nội dung: “${query.slice(0,320)}”.\n${near.length?'Câu hỏi ôn luyện đã có:\n'+near.map((q,i)=>`${i+1}. ${q.text}\n   Gợi ý: ${q.explain||'Đối chiếu SGK'}`).join('\n'):'Ngân hàng chưa có câu phù hợp với phạm vi này.'}\n\nCách thực hiện: (1) Xác định dữ kiện và yêu cầu; (2) viết công thức/phương trình; (3) kiểm tra đơn vị, điện tích, hệ số; (4) đối chiếu SGK, tài liệu học thuật.\n\nBạn có thể mở thư viện trực tuyến hoặc sao chép câu hỏi để hỏi ChatGPT trên trang riêng (không cần nhập khóa API trong WebApp).`,sources:[]};
}
function chemBuildVariables(g,c,index){let a=3+(index%7),p=2+(index%5),m=5.6*(1+(index%5));return {a,b:a+1,d:a+2,e:a-1,p,h:2*a+2,h2:2*a,h3:2*a-2,h4:2*a+4,m:chemFormatNum(m),mol:chemFormatNum(m/56),mol2:chemFormatNum((m/56)*2),mol3:chemFormatNum((m/56)*3),mol4:chemFormatNum((m/56)/2)}}
function chemLocalGenerate(req,types=null){
 const chapterArr=CURRICULUM[req.grade]||[],n=Math.min(12,Math.max(1,Number(req.count)||5));
 const scope=req.scope||'chapter';let candidates=CHEM_LIBRARY.filter(x=>x.g===req.grade);
 if(scope==='lesson')candidates=candidates.filter(x=>x.c===req.chapter && chapterArr[x.c]?.[1]?.[CHEM_LESSON_INDEX[req.grade+':'+x.c]||0]===req.lesson);
 if(scope==='chapter'||scope==='regular')candidates=candidates.filter(x=>x.c===req.chapter);
 if(scope==='mid1')candidates=candidates.filter(x=>x.c<Math.ceil(chapterArr.length/2));
 if(scope==='mid2')candidates=candidates.filter(x=>x.c>=Math.ceil(chapterArr.length/2));
 if(!candidates.length)return {text:'Chưa có mẫu Hóa học tích hợp đã kiểm chứng trong phạm vi này; giáo viên cần bổ sung ngân hàng.',questions:[]};
 const requestedTypes=types?.length?types:['mcq'];
 const result=[];
 for(let i=0;i<n;i++){
  const t=candidates[i%candidates.length];let v=chemBuildVariables(req.grade,t.c,i+Math.floor(Math.random()*5)),options=t.options.map(o=>chemFill(o,v));
  const stem=chemFill(t.stem,v),explain=chemFill(t.exp,v),correct=options[t.correct];
  const type=requestedTypes[i%requestedTypes.length];
  const q={grade:req.grade,chapter:t.c,lesson:chapterArr[t.c][1][CHEM_LESSON_INDEX[req.grade+':'+t.c]||0],type,level:/bao nhiêu mol|pH xấp xỉ|nguyên tử carbon/.test(stem)?'VD':'TH',text:stem,options:[],answer:'',explain,source:'Mẫu nội bộ tự biên soạn – giáo viên đối chiếu SGK trước khi duyệt'};
  if(type==='tf'){
   q.text='Đánh giá tính đúng/sai của các phát biểu sau dựa trên câu hỏi: '+stem;
   q.options=options.map(s=>'Phương án trả lời phù hợp là: '+s);q.answer=options.map((_,j)=>j===t.correct);
  } else if(type==='short'){
   q.text=stem;q.answer=correct;
  } else if(type==='essay'){
   q.text='Trình bày cơ sở hóa học để trả lời câu hỏi sau và giải thích lựa chọn: '+stem;
   q.answer='Đáp án: '+correct+'. '+explain;
  } else {
   const inds=[0,1,2,3].sort(()=>Math.random()-.5);q.options=inds.map(k=>options[k]);q.answer=inds.indexOf(t.correct);
  }
  if(result.some(x=>x.text===q.text&&x.type===q.type))continue;
  result.push(q);
 }
 return {text:`Đề xuất ${result.length} câu từ bộ mẫu Hóa học tích hợp sẵn, không gọi API hay tải câu trả lời trực tuyến. Đây là BẢN NHÁP CHỜ DUYỆT. Mẫu mặc định ở mức nhận biết / thông hiểu; với VD/VDC cần bổ sung bài tính phù hợp và giáo viên kiểm duyệt trước khi kiểm tra chính thức.`,questions:result};
}
function chemLocalTutor(req){if(req.mode==='generate')return chemLocalGenerate(req,req.requestedTypes);return chemPromptResult(req.mode,req.userText||req.prompt||'',req)}

function assistantPage(){return `${header('CHEM AI TUTOR','Trợ lý Hóa học tích hợp • Không cần API key','Hỏi đáp theo thư viện tích hợp, xử lý bài toán mẫu, tìm liên kết tài liệu và đề xuất câu hỏi chờ giáo viên duyệt; không cần khóa API.')}<div class="grid"><div class="card span8"><div class="formgrid"><div class="field wide"><label>Chức năng trợ lý</label><select id="aiMode"><option value="chat">Hỏi đáp kiến thức Hóa học</option><option value="solve">Giải bài tập từng bước</option><option value="generate">Tạo / bổ sung ngân hàng câu hỏi</option><option value="worksheet">Xây dựng phiếu học tập NLS/AI</option><option value="research">Tìm tài liệu online có nguồn</option></select></div><div class="field"><label>Mức độ</label><select id="aiLevel">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Số câu đề xuất</label><input id="aiCount" type="number" value="5" min="1" max="12"></div><div class="field full"><label>Yêu cầu / đề bài</label><textarea rows="6" id="aiText" placeholder="Ví dụ: Bổ sung 5 câu TN có đáp án, giải thích bài Sulfuric acid và muối sulfate lớp 11; gắn NLS/AI..."></textarea></div></div><div class="row" style="margin-top:14px">${btn('✦ Trợ lý hỗ trợ ngay',"askAI()",'mint')}${btn('Sao chép prompt cho ChatGPT',"copyPrompt()")}${btn('Tìm nguồn trên web',"searchRelated()",'secondary')}</div><div id="aiLoading" class="small muted" style="margin:12px 0"></div><div id="aiOutput">${STATE.aiResult?renderAiResult(STATE.aiResult):''}</div></div><div class="card span4"><h3>6 miền năng lực số – Thông tư 02/2025/TT-BGDĐT</h3>${NLS.map((x,i)=>`<div class="list-item small"><span class="tag">NLS ${i+1}</span> ${esc(x)}</div>`).join('')}<div class="notice warn">Mẫu câu tự động chỉ là dự thảo. Kiểm tra mức độ tư duy, cân bằng hóa học, đáp án, đơn vị và nguồn trước khi duyệt.</div><p class="smallnote">Hoạt động ngay trong trình duyệt, không cần GEMINI hay tài khoản AI. Không thay thế giáo viên; yêu cầu phức tạp cần nguồn đối chiếu.</p></div></div>${guide('assistant')}`}
function prepareAi(mode){STATE.aiLast=`Hãy soạn nội dung chính xác theo SGK Hóa ${STATE.grade} KNTT. Chương ${STATE.chapter+1}: ${gCh()[STATE.chapter]?.[0]||''}; Bài: ${STATE.lesson||'toàn chương'}. ${mode==='generate'?'Bổ sung câu hỏi có đáp án đúng, lời giải và nguồn học thuật; yêu cầu đa dạng bốn mức độ NB, TH, VD, VDC, có câu toán thực tế và nhiệm vụ NLS/AI.':'Tạo phiếu học tập phân hóa, có hoạt động khai thác và đánh giá thông tin số.'}`;go('assistant');$id('aiMode').value=mode;$id('aiText').value=STATE.aiLast}
function aiPrompt(){const mode=input('aiMode'),txt=input('aiText').trim()||STATE.aiLast,g=STATE.grade,lv=input('aiLevel')||'TH',count=num(input('aiCount'))||5;return `Bạn là giáo viên Hóa học THPT chuyên sâu, bám CTGDPT 2018 và sách KNTT lớp ${g}. Nhiệm vụ: ${mode}. Yêu cầu: ${txt}. Ưu tiên ${LEVELS[lv]}; số câu khoảng ${count}; viết công thức, số oxi hóa, ký hiệu và đơn vị chính xác; không sáng tác trích dẫn. Với bài tính hãy giải từ PTHH, mol, đại lượng bảo toàn, kiểm tra kết quả. Tích hợp NLS/AI theo TT02/2025/TT-BGDĐT. Với nguồn trực tuyến, ghi URL kiểm chứng được và phân biệt tri thức tự biên soạn với trích dẫn. Nêu điều cần giáo viên thẩm định.`}
function copyPrompt(){const p=aiPrompt();if(!p.trim())return toast('Cần nhập yêu cầu');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(p).then(()=>toast('Đã sao chép prompt')).catch(()=>fallbackCopy(p));else fallbackCopy(p)}
function fallbackCopy(p){let x=document.createElement('textarea');x.value=p;document.body.append(x);x.select();document.execCommand('copy');x.remove();toast('Đã sao chép prompt')}
function searchRelated(){const p=input('aiText')||`Hóa học ${STATE.grade} ${gCh()[STATE.chapter]?.[0]||''}`;window.open('https://www.google.com/search?q='+encodeURIComponent('Hóa học KNTT '+STATE.grade+' '+p.slice(0,130)),'_blank','noopener,noreferrer')}
function renderAiResult(result){const out=esc(result.text||'').replace(/\n/g,'<br>'),sources=(result.sources||[]).filter(x=>x.url&&/^https:\/\//.test(x.url));return `<div class="resultbox" style="margin-top:16px">${out||'Không có nội dung trả về.'}</div>${sources.length?`<div class="book"><h4 style="margin:0">Liên kết nguồn được tìm thấy</h4>${sources.map(s=>`<p class="small">• <a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.title||s.url)}</a></p>`).join('')}</div>`:''}${Array.isArray(result.questions)&&result.questions.length?`<div class="notice warn">AI đề xuất ${result.questions.length} câu hỏi. Mặc định lưu ở trạng thái <b>Chờ duyệt</b>. Giáo viên phải kiểm tra đáp án và nguồn trước khi duyệt.</div>${btn('Nhập các câu vào mục Chờ duyệt',"importAiQuestions()",'gold')}`:''}`}
async function askAI(){
 if(STATE.busy)return;
 const mode=input('aiMode'),userText=input('aiText').trim();
 if(!userText)return toast('Hãy nhập chủ đề, câu hỏi hoặc đề bài.');
 STATE.busy=true;
 const loading=$id('aiLoading'),output=$id('aiOutput');
 loading.textContent='Đang phân tích bằng thư viện Hóa học có sẵn trên thiết bị…';
 try{
  const req={mode,userText,grade:STATE.grade,chapter:STATE.chapter,lesson:STATE.lesson||gCh()[STATE.chapter]?.[1]?.[0],count:Math.min(12,num(input('aiCount'))||5),level:input('aiLevel'),scope:'chapter'};
  const result=chemLocalTutor(req);
  STATE.aiResult=result;
  output.innerHTML=renderAiResult(result);
 }catch(e){output.innerHTML='<div class="notice err">Không xử lý được yêu cầu: '+esc(e.message)+'</div>'}
 finally{loading.textContent='';STATE.busy=false}
}
function importAiQuestions(){let obj=STATE.aiResult||{},added=storeAiQuestions(obj.questions||[],{grade:STATE.grade,chapter:STATE.chapter,lesson:STATE.lesson});toast('Đã nhập '+added+' câu chờ giáo viên kiểm định.');go('bank')}
function storeAiQuestions(src,fallback={}){let added=0;for(let x of src){if(!x||!x.text)continue;let g=Number(x.grade)||fallback.grade||STATE.grade,c=Number.isInteger(Number(x.chapter))?Number(x.chapter):(fallback.chapter??STATE.chapter);if(!CURRICULUM[g]?.[c]){g=STATE.grade;c=STATE.chapter}let t=QTYPE.includes(x.type)?x.type:'mcq',ops=Array.isArray(x.options)?x.options.map(String):[];let ans=x.answer;if(t==='mcq'){if(ops.length!==4)continue;if(typeof ans==='string'&&/^[A-D]$/i.test(ans))ans=ans.toUpperCase().charCodeAt(0)-65;ans=Number(ans);if(!Number.isInteger(ans)||ans<0||ans>3)continue}if(t==='tf'&&(!Array.isArray(ans)||ans.length!==4))continue;if(DATA.questions.some(q=>q.grade===g&&q.text.trim().toLowerCase()===String(x.text).trim().toLowerCase()))continue;DATA.questions.unshift({id:uid(),grade:g,chapter:c,lesson:x.lesson||fallback.lesson||CURRICULUM[g][c][1][0],type:t,level:LEVELS[x.level]?x.level:'TH',text:String(x.text).slice(0,1500),options:ops,answer:ans??'',explain:String(x.explain||''),source:String(x.source||'AI đề xuất — yêu cầu giáo viên xác minh'),approved:false,created:new Date().toISOString()});added++}save();return added}
async function autoFillMissing(pool,counts,chapter,lesson,scope){
 if(STATE.busy)return;
 STATE.busy=true;
 const lacking=QTYPE.map(type=>({type,n:Math.max(0,counts[type]-pool.filter(x=>x.type===type).length)})).filter(x=>x.n>0);
 const requested=Math.min(12,lacking.reduce((s,x)=>s+x.n,0));
 const box=$id('examWarnings');
 box.insertAdjacentHTML('beforeend','<div class="notice" id="autofillStatus">Đang tạo gợi ý từ mẫu nội bộ đã biên soạn, không gọi AI API…</div>');
 try{
  const requestedTypes=lacking.flatMap(x=>Array.from({length:x.n},()=>x.type)).slice(0,requested);
  const result=chemLocalTutor({mode:'generate',grade:STATE.grade,chapter,lesson,scope,count:requested,requestedTypes});
  const added=storeAiQuestions(result.questions||[],{grade:STATE.grade,chapter,lesson});
  $id('autofillStatus').innerHTML=esc(result.text||'')+'<p>Đã thêm <b>'+added+'</b> câu mới vào trạng thái <b>Chờ duyệt</b>. Câu mẫu không thay thế ngân hàng được giáo viên thẩm định. <button class="btn gold sm" onclick="go(&#39;bank&#39;)">Mở ngân hàng duyệt câu</button></p>';
 }catch(e){$id('autofillStatus').textContent='Không bổ sung được: '+e.message+'; hãy nhập câu từ nguồn đáng tin cậy.'}
 finally{STATE.busy=false}
}

function config(){return {url:(DATA.settings.url||window.EDUPLAN_CONFIG?.supabaseUrl||'').trim().replace(/\/$/,''),anon:(DATA.settings.anon||window.EDUPLAN_CONFIG?.supabaseAnonKey||'').trim()}}
function cloudRequest(path,body=null,method='POST',auth=false){const c=config();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.url)||!c.anon)throw Error('Supabase Project URL / anon key chưa hợp lệ');const token=auth?sessionStorage.getItem('edpTeacherToken'):null;if(auth&&!token)throw Error('Giáo viên chưa đăng nhập Supabase Auth');return fetch(c.url+'/rest/v1/'+path,{method,headers:{'apikey':c.anon,'Authorization':'Bearer '+(token||c.anon),'Content-Type':'application/json',...(method==='POST'?{'Prefer':'return=representation'}:{})},...(body!==null?{body:JSON.stringify(body)}:{})}).then(async r=>{let txt=await r.text();let data=txt?JSON.parse(txt):null;if(!r.ok)throw Error(data?.message||data?.hint||txt.slice(0,200)||('HTTP '+r.status));return data})}
async function refreshCloud(){if(!supabase)return;let data=await cloudRequest('rpc/edp_public_stats',{});STATE.cloudStats=typeof data==='string'?JSON.parse(data):data;if(sessionStorage.getItem('edpTeacherToken')){try{STATE.cloudAttempts=await cloudRequest('edp_attempts?select=student_code,class_code,exam_title,grade,score,submitted_at&order=submitted_at.desc&limit=300',null,'GET',true)}catch(e){console.warn('Không thể tải điểm online:',e.message)}}return STATE.cloudStats}
async function connectCloud(){const c=config();if(!c.url||!c.anon){supabase=null;return false}const stats=await cloudRequest('rpc/edp_public_stats',{});supabase={url:c.url};STATE.cloudStats=typeof stats==='string'?JSON.parse(stats):stats;const vid=localStorage.getItem('eduplanVisitor');await cloudRequest('rpc/edp_register_visit',{p_visitor_key:vid});await refreshCloud();return true}
async function connectFromForm(){DATA.settings.url=input('setUrl').trim();DATA.settings.anon=input('setAnon').trim();save();$id('connectStatus').textContent='Đang thử truy cập dữ liệu Supabase...';try{await connectCloud();$id('connectStatus').textContent='✅ Kết nối thành công. Số lượt truy cập vừa được cập nhật trên máy chủ.';toast('Đã kết nối Supabase')}catch(e){supabase=null;$id('connectStatus').textContent='⚠️ Không kết nối được: '+e.message;toast('Kiểm tra URL, public key và tệp supabase.sql')}setTimeout(()=>{if(STATE.view==='settings')$id('modeBadge').outerHTML=mark().replace('<span','<span id="modeBadge"')},0)}
async function teacherLogin(){const c=config(),email=input('teacherEmail').trim(),pw=input('teacherPass');if(!c.url||!c.anon)return toast('Cần cấu hình Supabase trước');if(!email||!pw)return toast('Nhập email và mật khẩu giáo viên');try{const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':c.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.msg||d.error_description||d.error||'Đăng nhập thất bại');sessionStorage.setItem('edpTeacherToken',d.access_token);sessionStorage.setItem('edpTeacherExp',String(Date.now()+((d.expires_in||3600)-60)*1000));await refreshCloud();$id('teacherPass').value='';$id('loginStatus').textContent='✅ Đã đăng nhập giáo viên: '+email;toast('Đã đăng nhập, có thể công bố đề')}catch(e){toast('Đăng nhập lỗi: '+e.message)}}
function teacherLogout(){sessionStorage.removeItem('edpTeacherToken');sessionStorage.removeItem('edpTeacherExp');if($id('loginStatus'))$id('loginStatus').textContent='Đã đăng xuất.';toast('Đã đăng xuất')}
async function publishExam(){let ex=STATE.exam;if(!ex)return;let c=config();if(!c.url||!c.anon)return toast('Cần cấu hình Supabase để công bố');if(!sessionStorage.getItem('edpTeacherToken'))return toast('Cần đăng nhập giáo viên ở Cấu hình online');try{await cloudRequest('published_exams',{id:ex.id,title:ex.title,grade:ex.grade,payload:ex},'POST',true);let link=location.origin+location.pathname+'?exam='+encodeURIComponent(ex.id);dialog(`<h3>Đã công bố đề luyện tập trực tuyến!</h3><p>Mở trên thiết bị học sinh có website được triển khai và cấu hình Supabase trong config.js.</p><div class="field"><label>Đường dẫn làm bài</label><input id="publishedLink" value="${esc(link)}" readonly></div><div class="row" style="margin-top:12px">${btn('Sao chép liên kết',"navigator.clipboard.writeText(input('publishedLink')).then(()=>toast('Đã sao chép liên kết'))",'mint')}</div><p class="notice warn">Lưu ý: Đề công bố là luyện tập trực tuyến, không chống xem trước đáp án qua công cụ trình duyệt.</p>`)}catch(e){toast('Không công bố được: '+e.message)}}
async function loadPublished(id){try{const rows=await cloudRequest('published_exams?id=eq.'+encodeURIComponent(id)+'&select=payload',null,'GET');if(!rows||!rows[0]?.payload)throw Error('Không thấy đề hoặc chưa được công bố');let ex=rows[0].payload;if(!Array.isArray(ex.codes))throw Error('Dữ liệu đề sai');STATE.quiz=ex;STATE.grade=Number(ex.grade);STATE.activeCode=ex.codes[0].code;STATE.quizAnswers={};STATE.review=null;STATE.view='quiz';render()}catch(e){toast('Không mở được đề từ liên kết: '+e.message)}}
async function hashStudent(at){const bytes=new TextEncoder().encode('edp-v56:'+at.student.normalize('NFC').toLowerCase()+':'+at.classroom.toLowerCase());const h=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function cloudSubmitAttempt(at){const key=await hashStudent(at);await cloudRequest('rpc/edp_submit_attempt',{p_attempt_id:at.id,p_student_key:key,p_exam_ref:at.examId,p_grade:at.grade,p_score:at.score,p_student_code:at.student,p_class_code:at.classroom,p_exam_title:at.title});await refreshCloud()}
async function autoStart(){initVisit();addSeed();let globalCfg=window.EDUPLAN_CONFIG||{};if(globalCfg.supabaseUrl&&!DATA.settings.url){DATA.settings.url=globalCfg.supabaseUrl;DATA.settings.anon=globalCfg.supabaseAnonKey||'';save()}$id('globalGrade').addEventListener('change',e=>setGrade(e.target.value));$id('globalRole').addEventListener('change',e=>{STATE.role=e.target.value;localStorage.setItem('eduplanRole',STATE.role);render()});render();if(DATA.settings.url&&DATA.settings.anon){try{await connectCloud();render();let id=new URLSearchParams(location.search).get('exam');if(id)await loadPublished(id)}catch(e){console.warn('EduPlan Supabase:',e.message);toast('Chạy cục bộ: không kết nối được Supabase')}}else if(new URLSearchParams(location.search).get('exam'))toast('Để mở đề online, cần cấu hình Supabase trong config.js.');}
autoStart();
</script>
</body></html>
