x;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px auto 20px;max-width:750px}.ladder span{border:1px solid #ffffff18;border-radius:9px;padding:7px 10px;color:#899ac0;background:#101e42;font-size:12px}.ladder span.on{background:#5269e2;color:white;border-color:#a5b6ff}.arena{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;max-width:600px;margin:28px auto}.contestant{background:#293b67;border:1px solid #4c639a;border-radius:12px;min-height:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:22px;transition:.3s}.contestant small{font-size:9px;color:#bbcff5}.contestant.out{opacity:.2;filter:grayscale(1);transform:scale(.85)}.wheel-box{max-width:430px;margin:10px auto;position:relative}.wheel-pointer{position:absolute;left:calc(50% - 17px);top:-8px;z-index:3;color:#fff;font-size:36px;text-shadow:0 3px 4px #000}.wheel{width:100%;aspect-ratio:1;display:block;filter:drop-shadow(0 10px 22px #050c25ad)}.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;max-width:740px;margin:18px auto}.memory-card{height:105px;perspective:600px;cursor:pointer;background:transparent;border:0;padding:0}.memory-inner{width:100%;height:100%;position:relative;transition:transform .45s;transform-style:preserve-3d}.memory-card.revealed .memory-inner,.memory-card.matched .memory-inner{transform:rotateY(180deg)}.memory-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;display:grid;place-items:center;padding:7px;border:1px solid #7084dc;box-shadow:inset 0 0 16px #ffffff17;font-weight:800;overflow-wrap:anywhere}.memory-back{background:linear-gradient(130deg,#3c4fab,#915dd4);font-size:30px}.memory-front{background:#eaf3ff;color:#17356d;transform:rotateY(180deg);font-size:clamp(11px,1.8vw,18px)}.memory-card.matched .memory-front{background:#aaf2d5;border-color:#22c98b}.match-board{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:780px;margin:22px auto}.match-col{display:flex;flex-direction:column;gap:9px}.match-item,.sort-item{background:#253e78;border:1px solid #6786d1;color:white;border-radius:12px;padding:13px;text-align:center;font-weight:650;min-height:48px;transition:.2s;overflow-wrap:anywhere}.match-item:hover,.sort-item:hover{transform:translateY(-2px)}.match-item.selected{background:#6856ca;outline:2px solid #b0a0ff}.match-item.matched{background:#17684c;border-color:#5bd9ab;opacity:.73}.sort-layout{display:grid;grid-template-columns:1fr;gap:16px;max-width:930px;margin:14px auto}.sort-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:76px;padding:15px;background:#0a1c3f;border:1px dashed #6382d3;border-radius:14px}.sort-item{cursor:grab;min-width:88px}.sort-item.selected{outline:3px solid #ffdf7b;background:#6f4c9a}.sort-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.sort-bin{background:#122c53;border:2px dashed #6079b2;border-radius:16px;padding:12px;min-height:150px;transition:.2s}.sort-bin:hover{border-color:#9ae3fa}.sort-bin h3{font-size:14px;margin:4px 0 12px;text-align:center}.sort-bin .placed{background:#157c58;border-radius:7px;margin:5px 0;padding:8px;font-size:12px;text-align:center}.canvas-wrap{position:relative;width:100%;max-width:980px;margin:auto}.arcade-canvas{width:100%;height:auto;aspect-ratio:16/9;border-radius:14px;display:block;background:#101b42;touch-action:none}.game-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:9px}.game-controls button{min-width:72px;min-height:44px;border:1px solid #ffffff45;background:#223d73;border-radius:10px;color:white;font-weight:800}.game-controls button:active{background:#587cf5}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#040b22c7;border-radius:14px;z-index:10}.overlay-panel{padding:25px;text-align:center;max-width:550px}.overlay-panel h2{margin:7px 0;font-size:24px}.overlay-panel p{line-height:1.65}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#203d70;color:white;padding:11px 20px;border:1px solid #7192d8;border-radius:12px;z-index:999;max-width:90%;box-shadow:0 10px 30px #0008}.mini-question{position:absolute;top:11px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;text-align:center;border-radius:11px;background:#06132be8;color:#e6f0ff;padding:10px 15px;font-weight:700;font-size:clamp(10px,1.6vw,16px);pointer-events:none}.hidden{display:none!important}.footer{color:#7185ab;text-align:center;font-size:11px;margin:20px 0 8px}.sep{height:1px;background:#ffffff20;margin:16px 0}.inputanswer{background:#091a3b;border:1px solid #6486c5;color:white;border-radius:10px;padding:12px 14px;width:min(100%,440px);outline:none}.inputanswer:focus{border-color:#b6c7ff}@media(max-width:610px){.game-shell{padding:9px}.stage{padding:13px;min-height:410px}.answers{grid-template-columns:1fr;gap:8px}.answer{padding:11px;min-height:48px}.memory-grid{gap:6px}.memory-card{height:74px}.match-board{gap:12px}.match-item{padding:9px;font-size:12px}.stat{padding:7px;min-width:77px}.stat strong{font-size:15px}.intro{margin:40px auto 20px}.game-header{flex-wrap:wrap}.sort-bins{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style></head><body><div id="game-root"></div><script id="game-payload" type="application/json">{"id":"game-mvutwswm-jgfco","name":"Bắn bóng kiến thức – Bảng tuần hoàn các nguyên tố hóa học","kind":"bubbles","lessonTitle":"Bảng tuần hoàn các nguyên tố hóa học","subject":"Hóa học","grade":"10","questions":[{"id":"q-mvutws7a-l4tp3","text":"Nguyên tử có số hiệu nguyên tử Z = 17 là nguyên tố nào?","options":["Na","Cl","Ar","S"],"correct":1,"explanation":"Z = 17 tương ứng với chlorine (Cl)."},{"id":"q-mvutws7a-7sf2k","text":"Nguyên tố nào thuộc nhóm kim loại kiềm?","options":["Na","Mg","Cl","Ne"],"correct":0,"explanation":"Na thuộc nhóm IA (nhóm 1)."},{"id":"q-mvutws7a-uhmna","text":"Một nguyên tử trung hòa có 12 proton. Số electron bằng bao nhiêu?","options":["10","11","12","14"],"correct":2,"explanation":"Trong nguyên tử trung hòa, số proton bằng số electron."},{"id":"q-mvutws7a-1i3ig","text":"Nguyên tố có cấu hình electron 1s²2s²2p⁶3s¹ là?","options":["Mg","Al","Na","Si"],"correct":2,"explanation":"Tổng 11 electron, nguyên tố sodium (Na)."},{"id":"q-mvutws7a-y1m55","text":"Trong một chu kì, điện tích hạt nhân tăng theo chiều nào?","options":["Phải sang trái","Trái sang phải","Từ dưới lên","Không đổi"],"correct":1,"explanation":"Các nguyên tố được xếp theo chiều tăng điện tích hạt nhân."},{"id":"q-mvutws7a-xhmzq","text":"Nguyên tố nào là khí hiếm?","options":["F","Cl","Ne","Na"],"correct":2,"explanation":"Ne thuộc nhóm 18, nhóm khí hiếm."},{"id":"q-mvutws7a-bhpwt","text":"Nguyên tử có ba lớp electron thuộc chu kì mấy?","options":["1","2","3","4"],"correct":2,"explanation":"Số lớp electron đã chiếm bằng số thứ tự chu kì."},{"id":"q-mvutws7a-4utxi","text":"Cl thuộc nhóm nguyên tố nào?","options":["Kim loại kiềm","Halogen","Khí hiếm","Kim loại kiềm thổ"],"correct":1,"explanation":"Cl thuộc nhóm VIIA (nhóm 17), halogen."},{"id":"q-mvutws7a-yj8y4","text":"Nguyên tố Mg có số hiệu nguyên tử là?","options":["11","12","13","14"],"correct":1,"explanation":"Mg có 12 proton."},{"id":"q-mvutws7a-lsxm7","text":"Nguyên tố nào có tính kim loại rõ hơn trong cặp sau?","options":["Na","Cl","Ne","Ar"],"correct":0,"explanation":"Na là kim loại kiềm; các lựa chọn còn lại là phi kim/khí hiếm."},{"id":"q-mvutws7a-gsnne","text":"Kí hiệu hóa học của oxygen là?","options":["Ox","O","Og","Os"],"correct":1,"explanation":"O là kí hiệu hóa học của oxygen."},{"id":"q-mvutws7a-1fmgf","text":"Nguyên tố nào ở chu kì 2?","options":["Na","Mg","O","K"],"correct":2,"explanation":"O nằm ở chu kì 2."},{"id":"q-mvutws7a-7dl22","text":"Số electron lớp ngoài cùng của Na ở trạng thái cơ bản là?","options":["1","2","3","7"],"correct":0,"explanation":"Na có cấu hình 1s²2s²2p⁶3s¹."},{"id":"q-mvutws7a-zik02","text":"Trong bảng tuần hoàn hiện đại có bao nhiêu chu kì?","options":["5","6","7","8"],"correct":2,"explanation":"Bảng tuần hoàn hiện đại có 7 chu kì."},{"id":"q-mvutws7a-ecn8w","text":"Số thứ tự ô nguyên tố bằng đại lượng nào?","options":["Số neutron","Số hiệu nguyên tử","Số khối","Số lớp electron"],"correct":1,"explanation":"Số thứ tự ô nguyên tố bằng số hiệu nguyên tử Z."},{"id":"q-mvutws7a-i1t59","text":"Nguyên tử calcium (Z=20) thuộc chu kì nào?","options":["2","3","4","5"],"correct":2,"explanation":"Cấu hình lớp ngoài 4s², thuộc chu kì 4."}],"pairs":[{"id":"p-mvutws7a-8m83f","left":"Na","right":"Sodium"},{"id":"p-mvutws7a-yo90u","left":"Cl","right":"Chlorine"},{"id":"p-mvutws7a-jkevb","left":"Mg","right":"Magnesium"},{"id":"p-mvutws7a-twmlh","left":"O","right":"Oxygen"},{"id":"p-mvutws7a-g2eah","left":"Ne","right":"Neon"},{"id":"p-mvutws7a-qg913","left":"F","right":"Fluorine"},{"id":"p-mvutws7a-h9fc7","left":"Ca","right":"Calcium"},{"id":"p-mvutws7a-c36yl","left":"K","right":"Potassium"},{"id":"p-mvutws7a-quk9q","left":"Fe","right":"Iron"},{"id":"p-mvutws7a-x6k8m","left":"S","right":"Sulfur"}],"classifications":[{"id":"c-mvutws7a-ef0hh","item":"Na","category":"Kim loại"},{"id":"c-mvutws7a-ej46m","item":"Mg","category":"Kim loại"},{"id":"c-mvutws7a-oneth","item":"Ca","category":"Kim loại"},{"id":"c-mvutws7a-5hg1a","item":"K","category":"Kim loại"},{"id":"c-mvutws7a-amwwk","item":"Cl","category":"Phi kim"},{"id":"c-mvutws7a-cv0sz","item":"F","category":"Phi kim"},{"id":"c-mvutws7a-w5kld","item":"O","category":"Phi kim"},{"id":"c-mvutws7a-6ye0i","item":"S","category":"Phi kim"},{"id":"c-mvutws7a-h9u44","item":"Ne","category":"Khí hiếm"},{"id":"c-mvutws7a-hj0l3","item":"Ar","category":"Khí hiếm"}],"config":{"timeLimit":0,"lives":5,"difficulty":"normal","sound":true}}</script><script>(()=>{'use strict';
const raw=document.getElementById('game-payload');let G;try{G=JSON.parse(raw.textContent)}catch(e){document.body.textContent='Dữ liệu trò chơi không hợp lệ: '+e.message;return}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rand=n=>Math.floor(Math.random()*n),shuffle=a=>[...a].sort(()=>Math.random()-.5),clamp=(a,l,h)=>Math.max(l,Math.min(h,a));
const kind=G.kind||'millionaire';const icons={millionaire:'🏆',bell:'🔔',wheel:'🎡',memory:'🧩',bubbles:'🎯',racing:'🏎️',matching:'🔗',sorting:'🗂️'};const titles={millionaire:'Thử thách triệu phú',bell:'Rung chuông kiến thức',wheel:'Vòng quay kiến thức',memory:'Lật ô bí mật',bubbles:'Bắn bóng kiến thức',racing:'Đua xe kiến thức',matching:'Ghép đôi',sorting:'Phân loại'};
let st={score:0,life:3,combo:0,round:0,seconds:0,correct:0,wrong:0,playing:false,paused:false,finished:false},handlers=[],clock=null,raf=null,last=0,unload=[],audioCtx=null;
const qbank=(G.questions||[]).filter(q=>q&&q.text&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.options.length);const pairs=(G.pairs||[]).filter(p=>p&&p.left&&p.right),classes=(G.classifications||[]).filter(x=>x&&x.item&&x.category);
const $root=document.getElementById('game-root');const cfg=G.config||{};
function playSound(ok=true){if(cfg.sound===false)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(ok?660:220,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(ok?880:145,audioCtx.currentTime+.13);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.19);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}
function clear(){if(clock)clearInterval(clock);clock=null;if(raf)cancelAnimationFrame(raf);raf=null;handlers.forEach(f=>f());handlers=[];unload.forEach(f=>f());unload=[]}
function on(el,type,cb,options){el.addEventListener(type,cb,options);handlers.push(()=>el.removeEventListener(type,cb,options))}
function reset(){clear();st={score:0,life:cfg.lives||3,combo:0,round:0,seconds:cfg.timeLimit||0,correct:0,wrong:0,playing:true,paused:false,finished:false};last=0;playSound(true)}
function header(){return `<header class="game-header"><div class="logo"><i>✦</i> EDU GAME STUDIO AI</div><div class="pill">${esc(G.lessonTitle||'Trò chơi giáo dục')}</div><button id="pause-btn" class="btn alt small">Tạm dừng</button></header>`}
function hud(extra=''){return `<div class="hud"><div class="stat"><span>ĐIỂM</span><strong id="hud-score">${st.score}</strong></div><div class="stat"><span>HOÀN THÀNH</span><strong id="hud-correct">${st.correct}</strong></div><div class="stat"><span>COMBO</span><strong id="hud-combo">×${st.combo}</strong></div>${cfg.timeLimit>0?`<div class="stat"><span>THỜI GIAN</span><strong id="hud-time">${st.seconds}s</strong></div>`:''}${extra}</div>`}
function updateHud(){if($('#hud-score'))$('#hud-score').textContent=st.score;if($('#hud-correct'))$('#hud-correct').textContent=st.correct;if($('#hud-combo'))$('#hud-combo').textContent='×'+st.combo;if($('#hud-life'))$('#hud-life').textContent=st.life;if($('#hud-time'))$('#hud-time').textContent=st.seconds+'s'}
function shell(content,extra=''){return `<div class="game-shell">${header()}${hud(extra)}<main class="stage" id="stage">${content}</main><div class="footer">${esc(G.name||titles[kind])} • Hoạt động hoàn toàn trên thiết bị • Không cần AI để chơi</div></div>`}
function bindHeader(){let p=$('#pause-btn');if(p)on(p,'click',()=>pause())}
function pause(){if(st.finished)return;st.paused=!st.paused;const p=$('#pause-btn');if(p)p.textContent=st.paused?'Tiếp tục':'Tạm dừng';let ov=$('#pause-overlay');if(st.paused){if(!ov){$('#stage').insertAdjacentHTML('beforeend','<div class="overlay" id="pause-overlay"><div class="overlay-panel"><div class="hero-emoji">⏸️</div><h2>Đã tạm dừng</h2><p>Nhấn “Tiếp tục” để chơi.</p><button class="btn" id="resume-btn">Tiếp tục</button></div></div>');on($('#resume-btn'),'click',pause)}}else if(ov)ov.remove()}
function tick(seconds,cb){st.seconds=seconds;updateHud();clock=setInterval(()=>{if(st.paused||st.finished)return;st.seconds=Math.max(0,st.seconds-1);updateHud();if(st.seconds===0){clearInterval(clock);clock=null;cb()}},1000)}
function scoring(ok,amount=100){if(ok){st.correct++;st.combo++;st.score+=Math.round(amount*(1+Math.min(st.combo,5)*.1));playSound(true)}else{st.wrong++;st.combo=0;st.score=Math.max(0,st.score-Math.floor(amount*.2));playSound(false)}updateHud()}

function millionaire(){const qs=shuffle(qbank).slice(0,15);let index=0,used50=false,usedSkip=false,ladder=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000],prize=0;function render(){st.round=index;$root.innerHTML=shell(`<div class="center"><h2>🏆 Bậc thang tri thức</h2><p class="muted">Vượt qua từng mốc thưởng. Cân nhắc sử dụng quyền trợ giúp.</p></div><div class="ladder">${qs.map((_,i)=>`<span class="${i===index?'on':''}">${i+1} · ${ladder[i].toLocaleString('vi')}</span>`).join('')}</div><div id="q-area"></div><div class="btn-row"><button class="btn alt small" id="fifty" ${used50?'disabled':''}>✨ 50:50</button><button class="btn alt small" id="skip" ${usedSkip?'disabled':''}>↪ Bỏ qua</button><button class="btn alt small" id="stop">⏹ Dừng nhận điểm</button></div>`, `<div class="stat"><span>MỐC THƯỞNG</span><strong>${prize.toLocaleString('vi')}</strong></div>`);bindHeader();questionTurn(qs[index],ok=>{if(!ok){const safe=index>=10?ladder[9]:index>=5?ladder[4]:0;st.score=safe;finish(false,`Bạn dừng ở mốc ${safe.toLocaleString('vi')} điểm an toàn.`);return}prize=ladder[index];st.score=prize;index++;if(index>=qs.length)finish(true,'Bạn chinh phục tất cả '+qs.length+' mốc thưởng!');else render()},{points:0});$('#fifty').onclick=()=>{used50=true;const bad=[...$('#answer-list').querySelectorAll('button')].filter(x=>Number(x.dataset.answer)!==qs[index].correct);shuffle(bad).slice(0,Math.max(0,bad.length-1)).forEach(x=>x.disabled=true);$('#fifty').disabled=true};$('#skip').onclick=()=>{usedSkip=true;index++;if(index>=qs.length)finish(true,'Hoàn thành!');else render()};$('#stop').onclick=()=>{st.score=prize;finish(true,'Bạn chủ động dừng ở mốc '+prize.toLocaleString('vi')+' điểm.')}}render()}
function bell(){const qs=shuffle(qbank).slice(0,Math.min(12,qbank.length)),total=qs.length;let index=0,rescue=1,misses=0;function render(){st.round=index;$root.innerHTML=shell(`<div class="center"><h2>🔔 Rung chuông kiến thức</h2><p class="muted">Sai lần đầu có thể dùng cứu trợ. Sai lần nữa sẽ bị loại!</p></div><div class="arena">${Array.from({length:10},(_,i)=>`<div class="contestant ${i<misses*4?'out':''}">🎓<small>Thí sinh ${i+1}</small></div>`).join('')}</div><div id="q-area"></div><div class="btn-row"><button class="btn alt small" id="rescue" ${rescue===0?'disabled':''}>❤️ Cứu trợ ×${rescue}</button></div>`,`<div class="stat"><span>VÒNG</span><strong>${index+1}/${total}</strong></div><div class="stat"><span>LỖI</span><strong>${misses}</strong></div>`);bindHeader();questionTurn(qs[index],ok=>{if(!ok){if(rescue>0){misses++;st.life--;$('#q-area').insertAdjacentHTML('beforeend','<div class="feedback bad center">Bạn trả lời sai. Sử dụng quyền cứu trợ để được tiếp tục?</div><div class="btn-row"><button class="btn" id="take-rescue">❤️ Sử dụng cứu trợ</button><button class="btn alt" id="give-up">Kết thúc</button></div>');$('#take-rescue').onclick=()=>{rescue--;index++;if(index>=total)finish(true,'Bạn đã trụ lại đến vòng cuối!');else render()};$('#give-up').onclick=()=>finish(false,'Bạn đã bị loại khỏi sân thi.');return}finish(false,'Bạn đã bị loại khỏi sân thi.');return}index++;if(index>=total)finish(true,'Bạn đã rung chuông vàng sau '+total+' vòng!');else render()},{points:100});$('#rescue').onclick=()=>{if(rescue>0){rescue--;st.score=Math.max(0,st.score-50);$('#rescue').disabled=true;alertFeedback(true,'Đã dùng quyền cứu trợ: được phép bỏ qua vòng hiện tại.');index++;setTimeout(()=>{if(index>=total)finish(true,'Bạn đã vượt qua tất cả các vòng.');else render()},700)}}}render()}
function wheel(){const qs=shuffle(qbank).slice(0,Math.min(12,qbank.length));let turn=0,angle=0,busy=false,task=null;const sectors=[{label:'+100',color:'#7775ec',mod:100},{label:'+200',color:'#13a88c',mod:200},{label:'Thưởng',color:'#dc8e36',mod:300},{label:'+150',color:'#417bce',mod:150},{label:'Bất ngờ',color:'#bc59ad',mod:75},{label:'+250',color:'#3b93a5',mod:250}];function paint(){const c=$('#wheel-canvas');if(!c)return;const ctx=c.getContext('2d'),W=500,C=W/2,R=238;ctx.clearRect(0,0,W,W);for(let i=0;i<sectors.length;i++){let start=angle+i*Math.PI*2/sectors.length-Math.PI/2,end=start+Math.PI*2/sectors.length;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,start,end);ctx.closePath();ctx.fillStyle=sectors[i].color;ctx.fill();ctx.strokeStyle='#dbeafe';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.translate(C,C);ctx.rotate(start+Math.PI/sectors.length);ctx.fillStyle='#fff';ctx.font='bold 23px Arial';ctx.textAlign='right';ctx.fillText(sectors[i].label,R-16,8);ctx.restore()}ctx.beginPath();ctx.arc(C,C,32,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#334c89';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText('★',C,C+10)}function render(){st.round=turn;$root.innerHTML=shell(`<div class="center"><h2>🎡 Vòng quay kiến thức</h2><p class="muted">Quay để nhận số điểm thưởng cho nhiệm vụ tiếp theo.</p></div><div class="wheel-box"><div class="wheel-pointer">▼</div><canvas class="wheel" id="wheel-canvas" width="500" height="500" aria-label="Bánh xe phần thưởng"></canvas></div><div class="btn-row"><button class="btn" id="spin">🎡 Quay vòng quay</button></div><div id="wheel-task"></div>`,`<div class="stat"><span>LƯỢT</span><strong>${turn}/${qs.length}</strong></div>`);bindHeader();paint();$('#spin').onclick=spin}function spin(){if(busy||st.paused)return;busy=true;$('#spin').disabled=true;let start=performance.now(),initial=angle,duration=2500+rand(1000),distance=Math.PI*(7+rand(8))+Math.random()*3;function frame(t){if(st.paused){start+=16;raf=requestAnimationF function memory(){const p=shuffle(pairs).slice(0,Math.min(6,pairs.length)),cards=shuffle(p.flatMap((x,i)=>[{id:i,label:x.left},{id:i,label:x.right}]));let opened=[],matched=new Set(),turns=0,locked=false;function render(){st.round=turns;$root.innerHTML=shell(`<div class="center"><h2>🧩 Lật ô bí mật</h2><p class="muted">Ghi nhớ vị trí, tìm hai thẻ có quan hệ tương ứng.</p></div><div class="memory-grid">${cards.map((c,i)=>`<button class="memory-card ${matched.has(c.id)?'matched':''}" data-card="${i}"><div class="memory-inner"><div class="memory-face memory-back">✦</div><div class="memory-face memory-front">${esc(c.label)}</div></div></button>`).join('')}</div>`,`<div class="stat"><span>LƯỢT LẬT</span><strong>${turns}</strong></div>`);bindHeader();$('#stage').querySelectorAll('[data-card]').forEach(b=>on(b,'click',()=>{if(st.paused||locked||st.finished)return;const i=Number(b.dataset.card),card=cards[i];if(matched.has(card.id)||opened.includes(i))return;b.classList.add('revealed');opened.push(i);if(opened.length===2){turns++;if(cards[opened[0]].id===cards[opened[1]].id){matched.add(card.id);scoring(true,120);opened.forEach(idx=>$('#stage').querySelector(`[data-card="${idx}"]`).classList.add('matched'));opened=[];if(matched.size===p.length)setTimeout(()=>finish(true,'Bạn đã tìm tất cả '+p.length+' cặp thẻ!'),600)}else{scoring(false,30);locked=true;const ids=[...opened];setTimeout(()=>{if(st.finished)return;ids.forEach(idx=>{const el=$('#stage').querySelector(`[data-card="${idx}"]`);if(el)el.classList.remove('revealed')});opened=[];locked=false},850)}st.round=turns}}))}render()}
function matching(){let p=shuffle(pairs).slice(0,Math.min(10,pairs.length)),right=shuffle(p.map((x,i)=>({...x,id:i})));let done=new Set(),selected=null,attempt=0;function render(){st.round=attempt;$root.innerHTML=shell(`<div class="center"><h2>🔗 Ghép đôi kiến thức</h2><p class="muted">Chọn thẻ bên trái rồi chọn thẻ tương ứng bên phải.</p></div><div class="match-board"><div class="match-col">${p.map((x,i)=>`<button class="match-item ${done.has(i)?'matched':''}" data-left="${i}" ${done.has(i)?'disabled':''}>${esc(x.left)}</button>`).join('')}</div><div class="match-col">${right.map(x=>`<button class="match-item ${done.has(x.id)?'matched':''}" data-right="${x.id}" ${done.has(x.id)?'disabled':''}>${esc(x.right)}</button>`).join('')}</div></div>`,`<div class="stat"><span>CẶP GHÉP</span><strong>${done.size}/${p.length}</strong></div>`);bindHeader();$$('[data-left]').forEach(b=>on(b,'click',()=>{selected=Number(b.dataset.left);$$('[data-left]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));$$('[data-right]').forEach(b=>on(b,'click',()=>{if(selected===null||st.paused)return;const ok=Number(b.dataset.right)===selected;attempt++;scoring(ok,100);if(ok){done.add(selected);selected=null;render();if(done.size===p.length)setTimeout(()=>finish(true,'Bạn ghép đúng toàn bộ '+p.length+' cặp!'),450)}else{alertFeedback(false,'Chưa đúng, hãy thử lại!');$$('[data-left]').forEach(x=>x.classList.remove('selected'));selected=null}}))}function $$(s){return [...document.querySelectorAll(s)]}render()}
function sorting(){let items=shuffle(classes).map((x,i)=>({...x,id:i})),cats=[...new Set(items.map(x=>x.category))],done=new Set(),chosen=null;function render(){st.round=done.size;$root.innerHTML=shell(`<div class="center"><h2>🗂️ Phân loại kiến thức</h2><p class="muted">Kéo thẻ hoặc chạm chọn thẻ, rồi chạm vào vùng phân loại đúng.</p></div><div class="sort-layout"><div class="sort-pool">${items.filter(x=>!done.has(x.id)).map(x=>`<button draggable="true" class="sort-item ${chosen===x.id?'selected':''}" data-item="${x.id}">${esc(x.item)}</button>`).join('')}</div><div class="sort-bins">${cats.map(c=>`<div class="sort-bin" data-bin="${esc(c)}" role="button" tabindex="0"><h3>${esc(c)}</h3>${items.filter(x=>done.has(x.id)&&x.category===c).map(x=>`<div class="placed">✓ ${esc(x.item)}</div>`).join('')}</div>`).join('')}</div></div>`,`<div class="stat"><span>ĐÃ XẾP</span><strong>${done.size}/${items.length}</strong></div>`);bindHeader();$$('[data-item]').forEach(b=>{on(b,'click',()=>{chosen=Number(b.dataset.item);$$('[data-item]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.item)===chosen))});on(b,'dragstart',e=>{chosen=Number(b.dataset.item);e.dataTransfer.setData('text/plain',String(chosen))})});$$('[data-bin]').forEach(b=>{on(b,'dragover',e=>e.preventDefault());on(b,'drop',e=>{e.preventDefault();place(b.dataset.bin)});on(b,'click',()=>place(b.dataset.bin));on(b,'keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(b.dataset.bin)}})})}function place(category){if(chosen===null||st.paused)return;let i=items.find(x=>x.id===chosen),ok=i.category===category;scoring(ok,90);if(ok){done.add(chosen);chosen=null;render();if(done.size===items.length)setTimeout(()=>finish(true,'Bạn đã phân loại chính xác '+items.length+' đối tượng!'),450)}else alertFeedback(false,'Chưa đúng nhóm. Hãy xem lại tiêu chí phân loại.')}function $$(s){return [...document.querySelectorAll(s)]}render()}
function bubbles(){let qs=shuffle(qbank).slice(0,Math.min(qbank.length,12)),qi=0,shots=0,balls=[],bullets=[],time=0,pointer={x:480,y:480},w=960,h=540,keys=new Set(),canvas,ctx;function spawn(){if(qi>=qs.length)return;const q=qs[qi];balls=q.options.map((o,i)=>({x:135+i*220,y:100+rand(130),vx:(Math.random()-.5)*1.7,vy:.5+Math.random()*.65,r:48,label:o,index:i,alive:true,hue:[190,270,28,145][i%4]}))}function draw(){ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0b1a4c');sky.addColorStop(1,'#234478');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<36;i++){ctx.fillStyle='#ffffff'+(i%4===0?'60':'25');ctx.fillRect((i*67)%w,(i*113)%h,2,2)}ctx.save();ctx.fillStyle='#ffffff10';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc((i*137+time*.12)%w,(i*73+time*.25)%h,25,0,Math.PI*2);ctx.fill()}ctx.restore();balls.forEach(b=>{if(!b.alive)return;ctx.shadowColor=`hsl(${b.hue},90%,70%)`;ctx.shadowBlur=24;const grd=ctx.createRadialGradient(b.x-14,b.y-18,5,b.x,b.y,b.r);grd.addColorStop(0,'#ffffff');grd.addColorStop(.25,`hsl(${b.hue},85%,72%)`);grd.addColorStop(1,`hsl(${b.hue},75%,43%)`);ctx.fillStyle=grd;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#091a37';ctx.font='bold 16px Arial';ctx.textAlign='center';const label=b.label.length>16?b.label.slice(0,15)+'…':b.label;ctx.fillText(label,b.x,b.y+5,84)});bullets.forEach(b=>{ctx.strokeStyle='#9bf3ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*3,b.y-b.vy*3);ctx.stroke()});ctx.fillStyle='#dfe8ff';ctx.fillRect(w/2-37,h-39,74,35);ctx.fillStyle='#83a6ff';ctx.beginPath();ctx.moveTo(w/2-30,h-39);ctx.lineTo(w/2,h-85);ctx.lineTo(w/2+30,h-39);ctx.fill();ctx.strokeStyle='#feef91';ctx.lineWidth=2;ctx.beginPath();ctx.arc(pointer.x,pointer.y,15,0,Math.PI*2);ctx.moveTo(pointer.x-24,pointer.y);ctx.lineTo(pointer.x-8,pointer.y);ctx.moveTo(pointer.x+8,pointer.y);ctx.lineTo(pointer.x+24,pointer.y);ctx.stroke()}

function shoot(){if(st.paused||st.finished)return;shots++;const dx=pointer.x-w/2,dy=pointer.y-(h-60),m=Math.hypot(dx,dy)||1;bullets.push({x:w/2,y:h-60,vx:dx/m*13,vy:dy/m*13});playSound(true)}
function init(){st.life=cfg.lives||5;spawn();$root.innerHTML=shell(`<div class="canvas-wrap"><canvas id="arcade" class="arcade-canvas" width="960" height="540"></canvas><div class="mini-question" id="arcade-prompt"></div></div><div class="game-controls"><button id="fire">◎ BẮN</button><button id="a-left">◀</button><button id="a-right">▶</button></div><div class="muted center" style="font-size:12px;margin-top:12px">Nhấp lên vùng chơi để ngắm và bắn • Dùng nút BẮN trên điện thoại</div>`,`<div class="stat"><span>MẠNG</span><strong id="hud-life">${st.life}</strong></div><div class="stat"><span>ĐỢT</span><strong id="hud-wave">1/${qs.length}</strong></div>`);bindHeader();canvas=$('#arcade');ctx=canvas.getContext('2d');$('#arcade-prompt').textContent=qs[qi].text;on(canvas,'pointermove',e=>aim(e.clientX,e.clientY));on(canvas,'pointerdown',e=>{aim(e.clientX,e.clientY);shoot()});on($('#fire'),'click',shoot);on($('#a-left'),'click',()=>pointer.x=clamp(pointer.x-110,50,w-50));on($('#a-right'),'click',()=>pointer.x=clamp(pointer.x+110,50,w-50));on(window,'keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot()}if(e.key==='ArrowLeft')pointer.x=clamp(pointer.x-50,50,w-50);if(e.key==='ArrowRight')pointer.x=clamp(pointer.x+50,50,w-50)});raf=requestAnimationFrame(loop)}function nextWave(ok){scoring(ok,100);qi++;if(qi>=qs.length){finish(true,'Bạn đã vượt qua '+qs.length+' đợt bóng!');return}spawn();$('#arcade-prompt').textContent=qs[qi].text;$('#hud-wave').textContent=(qi+1)+'/'+qs.length}
function loop(ts){if(st.finished)return;const d=last?Math.min(35,ts-last)/16.66:1;last=ts;if(!st.paused){time+=d;balls.forEach(b=>{if(!b.alive)return;b.x+=b.vx*d;b.y+=b.vy*d;if(b.x<55||b.x>w-55)b.vx*=-1;if(b.y>h-70){b.y=70;st.life--;updateHud();playSound(false);if(st.life<=0){finish(false,'Bạn đã hết mạng.');return}}});bullets.forEach(b=>{b.x+=b.vx*d;b.y+=b.vy*d;balls.forEach(x=>{if(!x.alive||Math.hypot(x.x-b.x,x.y-b.y)>x.r+4)return;x.alive=false;b.y=-100;const ok=x.index===qs[qi].correct;if(ok){nextWave(true)}else{scoring(false,65);st.life--;updateHud();if(st.life<=0)finish(false,'Bạn đã bắn nhầm quá nhiều lần.')}})});bullets=bullets.filter(b=>b.x>-20&&b.x<w+20&&b.y>-20&&b.y<h+20);if(balls.every(b=>!b.alive)&&!st.finished)nextWave(false);if(!st.finished)draw()}if(!st.finished)raf=requestAnimationFrame(loop)}init()}
function racing(){const qs=shuffle(qbank).slice(0,Math.min(12,qbank.length));let qi=0,carLane=1,dist=0,speed=5,gateY=-180,locked=false,obs=[],canvas,ctx,lastGate=-1,roadPhase=0,w=960,h=540;const lanes=4;function render(){st.life=cfg.lives||4;$root.innerHTML=shell(`<div class="canvas-wrap"><canvas id="race" class="arcade-canvas" width="960" height="540"></canvas><div class="mini-question" id="race-prompt"></div></div><div class="race-legend" id="race-legend"></div><div class="game-controls"><button id="left">◀ TRÁI</button><button id="right">PHẢI ▶</button><button id="brake">⬇ GIẢM TỐC</button></div><div class="muted center" style="font-size:12px;margin-top:9px">Phím ← → để chuyển làn. Đi qua cổng có đáp án đúng.</div>`,`<div class="stat"><span>TỐC ĐỘ</span><strong id="hud-speed">${speed*22} km/h</strong></div><div class="stat"><span>NĂNG LƯỢNG</span><strong id="hud-life">${st.life}</strong></div><div class="stat"><span>TIẾN ĐỘ</span><strong id="race-progress">0/${qs.length}</strong></div>`);bindHeader();$('#race-prompt').textContent=qs[qi].text;$('#race-legend').innerHTML=qs[qi].options.map((o,i)=>`<span><b>${String.fromCharCode(65+i)}</b> ${esc(o)}</span>`).join('');canvas=$('#race');ctx=canvas.getContext('2d');on($('#left'),'click',()=>carLane=clamp(carLane-1,0,lanes-1));on($('#right'),'click',()=>carLane=clamp(carLane+1,0,lanes-1));on($('#brake'),'click',()=>speed=Math.max(2.3,speed-.8));on(window,'keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();carLane=clamp(carLane-1,0,lanes-1)}if(e.key==='ArrowRight'){e.preventDefault();carLane=clamp(carLane+1,0,lanes-1)}if(e.key==='ArrowDown')speed=Math.max(2.3,speed-.7)});raf=requestAnimationFrame(loop)}
function project(lane,t){const roadW=120+t*610,center=w/2,step=roadW/lanes;return center-roadW/2+(lane+.5)*step}function draw(){const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#5ea9d3');sky.addColorStop(.48,'#a7d7ec');sky.addColorStop(.49,'#6eb288');sky.addColorStop(1,'#317a58');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#244b76';for(let i=0;i<8;i++){ctx.beginPath();const x=i*150-80;ctx.moveTo(x,280);ctx.lineTo(x+120,135+i%3*30);ctx.lineTo(x+260,280);ctx.fill()}ctx.fillStyle='#2b3450';ctx.beginPath();ctx.moveTo(420,258);ctx.lineTo(540,258);ctx.lineTo(905,h);ctx.lineTo(55,h);ctx.fill();ctx.strokeStyle='#e4e7f8';ctx.lineWidth=3;for(let i=1;i<lanes;i++){for(let z=0;z<14;z++){const t=((z/14+roadPhase)%1),t2=Math.min(1,t+.038),y=260+t*t*(h-260),yy=260+t2*t2*(h-260),x=project(i-.5,t);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(project(i-.5,t2),yy);ctx.stroke()}}for(let lane=0;lane<lanes;lane++){const yy=gateY;const t=clamp((yy-260)/(h-260),.04,1);if(yy<230||yy>h+70)continue;const ww=30+120*t;const x=project(lane,t);const q=qs[qi];ctx.fillStyle=['#76bee7','#bca0ed','#ffc782','#76d4b0'][lane];ctx.globalAlpha=.82;ctx.fillRect(x-ww*.48,yy-55*t,ww,65*t+12);ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.strokeRect(x-ww*.48,yy-55*t,ww,65*t+12);ctx.fillStyle='#101d37';ctx.font=`bold ${Math.round(10+16*t)}px Arial`;ctx.textAlign='center';ctx.fillText(String.fromCharCode(65+lane),x,yy-10*t+2)}let x=project(carLane,1),y=h-83;ctx.shadowColor='#0b102e';ctx.shadowBlur=15;ctx.fillStyle='#f34b69';ctx.fillRect(x-40,y-20,80,70);ctx.fillStyle='#fac9cb';ctx.fillRect(x-29,y-8,58,25);ctx.fillStyle='#12172c';ctx.fillRect(x-49,y-8,12,23);ctx.fillRect(x+37,y-8,12,23);ctx.fillRect(x-49,y+34,12,23);ctx.fillRect(x+37,y+34,12,23);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('EDU',x,y+51)}
function loop(t){if(st.finished)return;const dt=last?Math.min(35,t-last)/16.66:1;last=t;if(!st.paused){speed=Math.min(7.5,speed+.002*dt);dist+=speed*dt;roadPhase+=speed*dt*.007;gateY+=speed*dt*.42;if(gateY>h-90&&!locked){locked=true;const ok=carLane===qs[qi].correct;scoring(ok,145);if(ok)speed=Math.min(7.5,speed+1);else{st.life--;speed=Math.max(2.5,speed-1.6);updateHud();if(st.life<=0){finish(false,'Xe đã hết năng lượng trước khi về đích.');return}}qi++;if(qi>=qs.length){finish(true,'Bạn đã về đích sau '+qs.length+' cổng kiến thức!');return}$('#race-progress').textContent=qi+'/'+qs.length;$('#race-prompt').textContent=qs[qi].text;$('#race-legend').innerHTML=qs[qi].options.map((o,i)=>`<span><b>${String.fromCharCode(65+i)}</b> ${esc(o)}</span>`).join('')}if(gateY>h+110){gateY=-110;locked=false}$('#hud-speed').textContent=Math.round(speed*23)+' km/h';draw()}if(!st.finished)raf=requestAnimationFrame(loop)}render()}
function start(){reset();if(kind==='millionaire')millionaire();else if(kind==='bell')bell();else if(kind==='wheel')wheel();else if(kind==='memory')memory();else if(kind==='bubbles')bubbles();else if(kind==='racing')racing();else if(kind==='matching')matching();else if(kind==='sorting')sorting();else intro();if(cfg.timeLimit>0)tick(cfg.timeLimit,()=>finish(false,'Đã hết thời gian chơi.'))}
intro();window.addEventListener('message',e=>{if(e.data?.type==='EDUGAME_PAUSE'&&st.playing&&!st.paused)pause()});
})();
</script></body></html>
